name: mobile-ci

# No push trigger (TRA-411, 2026-10-12): main is strict-protected, so the merge commit is the tree this
# check already ran on the PR; a push run only held a self-hosted runner while the next PR waited.
# Path filter (TRA-415, TRA-417, 2026-10-12): #338 changed 3 lines under .claude/ and held the `ios` runner for
# 19 min while the light jobs queued behind each other; after TRA-415 ignored .claude/, docs/ and *.md, #341
# (only vitest.config.ts and a vitest setup file) still started the native checks. A deny-list is never
# complete, so `paths` lists the inputs. mobile-check is not a required check.
# Rule: every input must be listed in `paths`. test/native-ci-triggers.test.ts enforces it for the files of
# mobile/ and fails if one of them refers to a path outside mobile/.
# `paths` on pull_request: the workflow starts when at least one changed file matches at least one pattern, so
# a PR touching only unlisted files creates no run at all (ready or draft). `*` stays inside a path segment, `**`
# crosses `/`. `!` and `? + [ ] \` are forbidden: the test only models `*` and `**`. GitHub reads at most
# 3,000 files of a diff; if no matching file is among them the workflow does not start (no fail-safe there).
# Inputs of mobile-check (npm ci, lint, typecheck, test, all run in mobile/):
#   mobile/**    sources, tests, mobile/package-lock.json, tsconfig, jest config, mobile/biome.json
#   biome.json   the root one: mobile/biome.json is `"root": false` and inherits from it
#   .github/workflows/mobile-ci.yml   this file
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mobile/**"
      - "biome.json"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    # Draft PRs are excluded until GitHub emits ready_for_review for this workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 2026-11-16 (TRA-703): hosted runner, the self-hosted ones have been off since 2026-10-24.
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # The self-hosted runner uses a personal macOS account. Keep npm and git configuration
        # inside the job so the workflow cannot write to the host account's HOME.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Lint mobile
        run: npm run lint
        working-directory: mobile
      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile
      - name: Test mobile
        run: npm run test
        working-directory: mobile
