name: mobile-ci

# No push trigger (TRA-411, 2026-10-12): main is strict-protected, so the merge commit is the tree this
# check already ran on the PR; a push run only held a self-hosted runner while the next PR waited.
# Path filter (TRA-415, 2026-10-12): #338 changed 3 lines under .claude/ and still held the `ios` runner for
# 19 min (ios-check) while the light jobs queued one after the other on the second runner. mobile-check is not
# a required check, so a PR that only touches paths it never reads can skip it.
# Rule: an ignored path must never be an entry of ios/scripts/check.sh or of the contract harness. Only
# `paths-ignore` is used, so it fails safe: any path not listed below triggers the check.
# Inputs of mobile-check, never to ignore: mobile/** (sources, package-lock.json, configs), the root
# biome.json (mobile/biome.json is `"root": false`, it inherits from it) and this file. mobile/ imports nothing
# from src/.
# Ignored, each proven not to be read by the mobile steps:
#   .claude/**  agent and hook configuration, not shipped and not imported
#   docs/**     documents and design exports; src/ only names them in comments
#   *.md        root-level notes only (`*` stays in one segment); no **/*.md, a Markdown file under ios/
#               or mobile/ could be a bundled resource
# NOT ignored, although it looks inert: cache/** (1600+ files, frequent data PRs). The harness sets
#   ODYSSEY_CACHE_DIR to a temp dir, but src/graph.ts resolves data/genre-taxonomy.json sources against
#   <repo>/cache (genre-taxonomy.ts cacheRootFor) whatever that variable says, and the catalog served to the
#   XCTests includes that taxonomy. Checked 2026-10-12 with ODYSSEY_CACHE_DIR on an empty dir: 271 genres
#   still resolved their sources from the repo cache.
# Keep test/native-ci-triggers.test.ts and the dispatcher's ci-merge.sh in line when this list changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - ".claude/**"
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    # Draft PRs are excluded until GitHub emits ready_for_review for this workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Isolate HOME from the runner host account
        # The self-hosted runner uses a personal macOS account. Keep npm and git configuration
        # inside the job so the workflow cannot write to the host account's HOME.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Lint mobile
        run: npm run lint
        working-directory: mobile
      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile
      - name: Test mobile
        run: npm run test
        working-directory: mobile
