name: review-gate

on:
  pull_request:
    types: [opened, labeled, unlabeled, ready_for_review, synchronize, reopened]

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event.pull_request.draft == false
    # 2026-11-16 (TRA-703): hosted runner, the self-hosted ones have been off since 2026-10-24; the gate stayed
    # queued ("Expected") on every PR until then.
    runs-on: ubuntu-latest
    # TRA-520 (2026-10-15): the 24 polling attempts took 7 min 59 s with the previous version of this job and the
    # API calls added here cost about 8 s more; 8 minutes would have turned a legitimate wait into a timeout.
    timeout-minutes: 9
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      # TRA-520: list the workflow runs of the head to tell the `review` check-run of ai-review.yml from a forged one.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # TRA-526: which pull request is evaluated. The branch names are chosen by the PR author, so they go through
      # env and never into the script text.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # TRA-520 (2026-10-15): no `npm ci` and no `tsx` here. The policy below is executed from the default branch's
      # copy, and node 22 strips its types natively; installing the PR's dependencies would let the PR swap the
      # interpreter that runs the code it is not allowed to change.
      - uses: actions/setup-node@v4
        # Pinned like mobile-ci.yml: the flag below is experimental and its behavior moved between 22.x releases.
        with: { node-version: 22.13.0 }
      - name: Load the review policy from the default branch
        # TRA-520: this job used to run scripts/ci/review-gate-policy.ts from the PR checkout, so a PR editing that
        # file decided by itself what the gate requires of it (tier, deep review). The copy of the default branch is
        # the only one executed, never the PR base's (a stacked PR's base is unreviewed). Fail closed: if the copy
        # cannot be read, `set -e` stops the job and nothing below runs, so the gate does not pass.
        shell: bash
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/review-gate-policy"
          rm -rf "$trusted"
          mkdir -p "$trusted"
          # Written aside and moved only once complete: a failed `git show` must not leave an empty policy behind.
          git show "origin/$DEFAULT_BRANCH:scripts/ci/review-gate-policy.ts" > "$trusted/policy.tmp"
          test -s "$trusted/policy.tmp"
          mv "$trusted/policy.tmp" "$trusted/review-gate-policy.ts"
          echo '{"type":"module"}' > "$trusted/package.json"
          # TRA-527 (2026-10-15): the accounts allowed to publish `codex-review` / `codex-deep-review` come from the
          # same place and with the same rules. A PR that appends its own login to the list in its checkout changes
          # nothing here: only the default branch's copy is read. Fail closed on a missing file, an unreadable one,
          # an empty list or a malformed login: with no allowed author no codex status counts, so a tier/3 waits.
          git show "origin/$DEFAULT_BRANCH:.github/review-gate-authors.txt" > "$trusted/authors.tmp"
          jq -Rn '[inputs | sub("#.*$"; "") | gsub("^\\s+|\\s+$"; "") | select(. != "")]' "$trusted/authors.tmp" > "$trusted/authors.json.tmp"
          jq -e 'length > 0 and all(.[]; test("^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$"))' "$trusted/authors.json.tmp" > /dev/null
          mv "$trusted/authors.json.tmp" "$trusted/authors.json"
      - name: Evaluate combined review policy
        shell: bash
        run: |
          set -euo pipefail
          ai_review_path=".github/workflows/ai-review.yml"
          api="$RUNNER_TEMP/review-gate-api"
          authors="$RUNNER_TEMP/review-gate-policy/authors.json"
          mkdir -p "$api"
          # jq program of the `review` check-run selection (tested as is by test/review-gate-workflow.test.ts).
          # TRA-520: a check-run is the AI review only if it is the `review` job of a `pull_request` run of
          # ai-review.yml on this exact sha: same check suite as that run, and its id is the id of one of that
          # run's jobs (an API-created check-run has no job), reported by the Actions app. The name alone is
          # forgeable: any workflow step of a PR can create a check-run called `review`, with any start time.
          # TRA-524 (2026-10-24): only a conclusion that carries a verdict (success, failure, neutral) is passed on.
          # Anything else is `missing`: no conclusion yet, and also cancelled, timed_out (the 25-minute timeout of
          # ai-review.yml), skipped, stale, action_required or a value GitHub adds later. Those mean that no review
          # completed, and `codex-review: success` alone must not pass the gate (review-gate-policy.ts checks it too).
          # TRA-526 (2026-10-24): the run must also be the one of THIS pull request, not just of this sha. A PR B
          # opened on the same sha against another base (or from a fork) produces a genuine run too, and a `labeled`
          # event on this PR would have kept its success. `pull_requests[]` of a run is empty on many real runs, so
          # it only rejects: a run that names another PR, or this one against another base, is not retained, but an
          # empty list is not required to be filled. What binds the run is its head branch and head repository, and
          # `$pulls`, the pull requests (any state) of this head branch that sit on this sha: when one of them targets
          # another base, two runs cannot be told apart, and when this PR is not in the list it is not established.
          # A PR of the same branch name left on an older sha (closed long ago, or a stack parent) says nothing about
          # this sha and does not count. Every doubt is `missing`. This is the same shape as `belongsToPullRequest` in
          # scripts/ci/review-reuse.ts, not the same rule: reuse is stricter on purpose (it also counts the PRs on the
          # PR's current head), so it never reuses a verdict that this gate would refuse.
          # TRA-749 (2026-11-16): the job name is the `job` argument, and the program runs twice: for `review` and for the
          # `deep-review` job of the same workflow, with the same proofs. Without the argument it stays `review` (the
          # selection tests of review-reuse.ts run it that way); both call sites below name the job.
          # TRA-529 (2026-10-24): `pull_requests[]` and `$pulls` are recomputed at every read, so the base they show is
          # the CURRENT one, not the one the run was made against, and `$pulls` ignores a PR B closed on another sha
          # that produced a genuine run on this one. Neither can carry that. That is the job of `validate_base` below,
          # applied to the selected check-run: a run counts only if it recorded THIS PR against the default branch.
          select_review=$(cat <<'JQ'
          ($ARGS.named.job // "review") as $job
          | [$pulls[] | select(.number == $pr.number or .head_sha == $sha)] as $heads
          | ($heads | any(.[]; .number == $pr.number) and all(.[]; .base_ref == $pr.baseRef)) as $unambiguous
          | [$runs[]
            | select($unambiguous
              and .path == $path and .event == "pull_request" and .head_sha == $sha
              and .head_branch == $pr.headRef and .head_repository == $pr.headRepo
              and (.pull_requests | length == 0
                or (any(.[]; .number == $pr.number) and all(.[]; .base_ref == $pr.baseRef))))] as $trusted
          | [$checks[]
            | select(.name == $job)
            | select(.head_sha == $sha and .app.slug == "github-actions")
            | . as $check
            | select(any($trusted[]; . as $run
                | $run.check_suite_id == $check.check_suite.id
                and any($jobs[]; .run_id == $run.id and .id == $check.id and .name == $job)))]
          | sort_by(.started_at) | last // {}
          | (.conclusion // "missing") as $conclusion
          | [(.id // 0), (if $conclusion | IN("success", "failure", "neutral") then $conclusion else "missing" end)] | @tsv
          JQ
          )
          # jq program of the base check (tested as is by test/review-gate-workflow.test.ts). TRA-529: the `review` job of
          # ai-review.yml writes `review-base v1 <pr number> <base ref>` from the event of its run (first step, so every
          # conclusion has it). The selected check-run counts only if it carries exactly that record for THIS pull
          # request, and the base is the default branch and still the PR's base. No record (a run from before TRA-529,
          # or a base ref the workflow refused to write), another PR, another base or several different records: false,
          # which the job turns into `missing`. Compared message to message, nothing parsed; the same rule as
          # `hasBaseRecord` in scripts/ci/review-reuse.ts. A record is not tamper-proof (a workflow step of the PR can
          # write notices as the same app), like the patch-id record: it stops the honest cases, which is what the
          # selection above could not see.
          validate_base=$(cat <<'JQ'
          [$notes[].message | strings | select(startswith("review-base "))] | unique as $records
          | ($pr.defaultBranch | length > 0) and $pr.baseRef == $pr.defaultBranch
            and $records == ["review-base v1 \($pr.number) \($pr.baseRef)"]
          JQ
          )
          # jq program of the `codex-*` status selection (tested as is by test/review-gate-workflow.test.ts).
          # TRA-527: a commit status is not bound to its author, so any token with `statuses: write` could post
          # `codex-deep-review: success` on any sha. Only a status created by one of the allowed accounts counts; a
          # status from anyone else is as if it did not exist (it neither satisfies the gate nor masks the real one),
          # and among the allowed ones the latest wins. Logins compare case-insensitively, like GitHub does.
          select_status=$(cat <<'JQ'
          [($allowed[0] // [])[] | ascii_downcase] as $logins
          | [$statuses[]
            | select(.context == $context)
            | select(((.creator.login // "") | ascii_downcase) as $login | any($logins[]; . == $login))]
          | sort_by([.created_at, .id]) | last | .state // "missing"
          JQ
          )
          for attempt in $(seq 1 24); do
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=50
            # TRA-553: --no-renames, so the source of a rename is a path of the PR too, and -z, so that git does not
            # quote a path with a non-ASCII byte (the quote would defeat the `^` anchors of the policy); see tier-guard
            # in ci.yml.
            paths=$(git diff -z --name-only --no-renames "${{ github.event.pull_request.base.sha }}"..."$SHA" | tr '\0' '\n' | jq -R . | jq -s .)
            labels=$(gh api --paginate "repos/$REPOSITORY/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name' | jq -R . | jq -s .)
            # TRA-520: among the check-runs that pass `select_review` the latest by start time wins (a re-run adds
            # one); none at all is `missing`, which never passes. Everything is paginated and goes through files, not
            # arguments: a PR must not push the real check-run off the first page, or break the command line, by
            # flooding the head with `review` check-runs. A failing call stops the job (set -e): fail closed.
            gh api --paginate "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=review&filter=all&per_page=100" \
              --jq '.check_runs[] | {id, name, head_sha, conclusion, started_at, app: {slug: .app.slug}, check_suite: {id: .check_suite.id}}' \
              > "$api/checks.json"
            # TRA-749: the `deep-review` check-runs, listed apart so that neither list can push the other's off a page.
            gh api --paginate "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=deep-review&filter=all&per_page=100" \
              --jq '.check_runs[] | {id, name, head_sha, conclusion, started_at, app: {slug: .app.slug}, check_suite: {id: .check_suite.id}}' \
              > "$api/deep-checks.json"
            gh api --paginate "repos/$REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | {id, path, event, head_sha, check_suite_id, head_branch, head_repository: .head_repository.full_name, pull_requests: [.pull_requests[] | {number, base_ref: .base.ref}]}' > "$api/runs.json"
            # TRA-526: the pull requests, open or not, whose head branch is this one. `head` is `<owner>:<branch>` and
            # filters on the head repository's owner. `--method GET`: gh switches to POST as soon as a field is given.
            # No head repository (a deleted fork) means no filter to send: an empty list, hence `missing`, and not a
            # `head=:<branch>` that GitHub might ignore, which would walk the whole history of the repository.
            : > "$api/pulls.json"
            if [ -n "$HEAD_REPO" ]; then
              gh api --paginate --method GET "repos/$REPOSITORY/pulls" -f head="${HEAD_REPO%%/*}:$HEAD_REF" -f state=all -f per_page=100 \
                --jq '.[] | {number, base_ref: .base.ref, head_sha: .head.sha}' > "$api/pulls.json"
            fi
            run_ids=$(jq -r --arg path "$ai_review_path" 'select(.path == $path) | .id' "$api/runs.json")
            : > "$api/jobs.json"
            for run_id in $run_ids; do
              gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
                --jq '.jobs[] | {id, name, run_id}' >> "$api/jobs.json"
            done
            pr=$(jq -nc --argjson number "$PR_NUMBER" --arg baseRef "$BASE_REF" --arg headRef "$HEAD_REF" \
              --arg headRepo "$HEAD_REPO" --arg defaultBranch "$DEFAULT_BRANCH" \
              '{number: $number, baseRef: $baseRef, headRef: $headRef, headRepo: $headRepo, defaultBranch: $defaultBranch}')
            claude_info=$(jq -nr --slurpfile checks "$api/checks.json" --slurpfile runs "$api/runs.json" \
              --slurpfile jobs "$api/jobs.json" --slurpfile pulls "$api/pulls.json" --argjson pr "$pr" \
              --arg sha "$SHA" --arg path "$ai_review_path" --arg job review "$select_review")
            IFS=$'\t' read -r claude_id claude <<< "$claude_info"
            # TRA-529: the annotations of the selected check-run, all pages, through a file like the other lists. They
            # say which pull request and which base the review ran against (`validate_base`) and, for a failure,
            # whether it blocks. A failing call stops the job (set -e): fail closed. A review that did not record this
            # PR against the default branch is no review: `missing`, as if the run did not exist, and the next
            # `synchronize` or `reopened` of the PR (a re-run of the old run would use the old workflow) produces one.
            : > "$api/annotations.json"
            if [ "$claude_id" != "0" ] && [ "$claude" != "missing" ]; then
              gh api --paginate "repos/$REPOSITORY/check-runs/$claude_id/annotations?per_page=100" \
                --jq '.[] | {message}' > "$api/annotations.json"
              base_ok=$(jq -nr --slurpfile notes "$api/annotations.json" --argjson pr "$pr" "$validate_base")
              if [ "$base_ok" != "true" ]; then
                echo "::warning::La review (check-run $claude_id) n'a pas enregistré cette PR contre la branche par défaut (review-base v1 $PR_NUMBER $BASE_REF) : elle ne compte pas. Pousser un commit, ou fermer puis rouvrir la PR, relance ai-review."
                claude=missing
                claude_id=0
              fi
            fi
            # TRA-749: same selection and same base check for the `deep-review` job; the policy reads the conclusion as
            # `deepClaude`. Unproven, absent or empty is `missing`, which never passes (touchesGate is the policy's to derive).
            deep_info=$(jq -nr --slurpfile checks "$api/deep-checks.json" --slurpfile runs "$api/runs.json" \
              --slurpfile jobs "$api/jobs.json" --slurpfile pulls "$api/pulls.json" --argjson pr "$pr" \
              --arg sha "$SHA" --arg path "$ai_review_path" --arg job deep-review "$select_review")
            IFS=$'\t' read -r deep_claude_id deep_claude <<< "$deep_info"
            : > "$api/deep-annotations.json"
            if [ "${deep_claude_id:-0}" != "0" ] && [ "${deep_claude:-missing}" != "missing" ]; then
              gh api --paginate "repos/$REPOSITORY/check-runs/$deep_claude_id/annotations?per_page=100" \
                --jq '.[] | {message}' > "$api/deep-annotations.json"
              deep_base_ok=$(jq -nr --slurpfile notes "$api/deep-annotations.json" --argjson pr "$pr" "$validate_base")
              if [ "$deep_base_ok" != "true" ]; then
                echo "::warning::La review profonde (check-run $deep_claude_id) n'a pas enregistré cette PR contre la branche par défaut : elle ne compte pas."
                deep_claude=missing
              fi
            fi
            claude_blocking=false
            if [ "$claude" = "failure" ]; then
              claude_blocking=$(jq -nr --slurpfile notes "$api/annotations.json" \
                'any($notes[]; .message == "Findings bloquants — voir les commentaires inline.")')
            fi
            # TRA-527: the statuses of the head, all pages (the combined `/status` endpoint hides the author of the
            # status it keeps and caps at 100), through a file like the other lists. A failing call stops the job.
            gh api --paginate "repos/$REPOSITORY/commits/$SHA/statuses?per_page=100" \
              --jq '.[] | {id, context, state, created_at, creator: {login: .creator.login}}' > "$api/statuses.json"
            codex=$(jq -nr --slurpfile statuses "$api/statuses.json" --slurpfile allowed "$authors" \
              --arg context codex-review "$select_status")
            deep=$(jq -nr --slurpfile statuses "$api/statuses.json" --slurpfile allowed "$authors" \
              --arg context codex-deep-review "$select_status")
            # A codex status from an account outside the list is dropped silently by the selection above: say so, or
            # a publisher logged in under another account would look like a review that never came.
            ignored=$(jq -nr --slurpfile statuses "$api/statuses.json" --slurpfile allowed "$authors" \
              '[($allowed[0] // [])[] | ascii_downcase] as $logins
              | [$statuses[] | select(.context == "codex-review" or .context == "codex-deep-review")
                | select(((.creator.login // "") | ascii_downcase) as $login | any($logins[]; . == $login) | not)
                | "\(.context) by \(.creator.login // "unknown")"] | unique | join(", ")')
            if [ -n "$ignored" ]; then
              echo "::warning::Statuts codex ignorés (auteur hors de .github/review-gate-authors.txt) : $ignored"
            fi
            input=$(jq -nc --argjson paths "$paths" --argjson labels "$labels" --arg claude "$claude" --arg codex "$codex" --arg deep "$deep" --arg deepClaude "${deep_claude:-missing}" --argjson claudeBlocking "$claude_blocking" '{paths:$paths,labels:$labels,ordinary:{claude:$claude,codex:$codex,claudeBlocking:$claudeBlocking},deep:$deep,deepClaude:$deepClaude,risk:1}')
            result=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/review-gate-policy/review-gate-policy.ts" "$input")
            decision=$(jq -r .verdict <<< "$result")
            echo "attempt=$attempt $result"
            case "$decision" in
              pass) exit 0 ;;
              block) echo "::error::Un fournisseur de review a détecté des findings bloquants."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Aucun fournisseur de review n'a validé ce SHA avant le délai."
          exit 1
