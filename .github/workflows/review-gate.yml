name: review-gate

on:
  pull_request:
    types: [opened, labeled, unlabeled, ready_for_review, synchronize, reopened]

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Evaluate combined review policy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=50
            paths=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..."$SHA" | jq -R . | jq -s .)
            labels=$(gh api --paginate "repos/$REPOSITORY/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name' | jq -R . | jq -s .)
            claude_info=$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=review&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.name == "review")] | sort_by(.started_at) | last // {} | [(.id // 0), (.conclusion // "missing")] | @tsv')
            IFS=$'\t' read -r claude_id claude <<< "$claude_info"
            claude_blocking=false
            if [ "$claude" = "failure" ] && [ "$claude_id" != "0" ]; then
              claude_blocking=$(gh api "repos/$REPOSITORY/check-runs/$claude_id/annotations?per_page=100" \
                --jq 'any(.[]; .message == "Findings bloquants — voir les commentaires inline.")')
            fi
            statuses=$(gh api "repos/$REPOSITORY/commits/$SHA/status")
            codex=$(jq -r '[.statuses[] | select(.context == "codex-review")] | first | .state // "missing"' <<< "$statuses")
            deep=$(jq -r '[.statuses[] | select(.context == "codex-deep-review")] | first | .state // "missing"' <<< "$statuses")
            input=$(jq -nc --argjson paths "$paths" --argjson labels "$labels" --arg claude "$claude" --arg codex "$codex" --arg deep "$deep" --argjson claudeBlocking "$claude_blocking" '{paths:$paths,labels:$labels,ordinary:{claude:$claude,codex:$codex,claudeBlocking:$claudeBlocking},deep:$deep,risk:1}')
            result=$(npx --no-install tsx scripts/ci/review-gate-policy.ts "$input")
            decision=$(jq -r .verdict <<< "$result")
            echo "attempt=$attempt $result"
            case "$decision" in
              pass) exit 0 ;;
              block) echo "::error::Un fournisseur de review a détecté des findings bloquants."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Aucun fournisseur de review n'a validé ce SHA avant le délai."
          exit 1
