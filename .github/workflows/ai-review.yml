name: ai-review
# Couche 2 de la review. Ne tourne que sur une PR passée en "ready",
# jamais sur un draft : un draft ne se review pas, il se travaille.
on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Review Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Token d'abonnement : la review est facturée sur le plan Max,
          # pas en crédits API. C'est le principal levier de coût du process.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Tu reviewes la PR #${{ github.event.pull_request.number }} de
            ${{ github.repository }}.

            1. Lis les instructions de review dans REVIEW.md à la racine et
               applique-les à la lettre, y compris le plafond de nits.
            2. Diffe la branche contre origin/${{ github.event.pull_request.base.ref }}.
               Pour chaque finding, vérifie le comportement réel dans le code
               avant de le rapporter — pas de déduction depuis un nom.
            3. Poste chaque finding en commentaire inline sur la ligne concernée
               via l'outil de commentaire inline. Français.
            4. Écris /tmp/review.json, et rien d'autre dans ce fichier :
               {"verdict":"pass"|"block","blocking":<n>,"nits":<n>,
                "summary":"<une ligne>",
                "findings":[{"file":"","line":0,"severity":"block"|"nit"|"pre-existing","message":""}]}
               verdict = "block" seulement s'il existe au moins un finding
               de sévérité "block" au sens de REVIEW.md.
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write,mcp__github_inline_comment__create_inline_comment"

      - name: Gate
        id: gate
        run: |
          if [ ! -f /tmp/review.json ]; then
            echo "::error::La review n'a pas produit de verdict."
            exit 1
          fi
          cat /tmp/review.json
          VERDICT=$(jq -r '.verdict' /tmp/review.json)
          jq -r '"\(.blocking) bloquant(s), \(.nits) nit(s) — \(.summary)"' /tmp/review.json >> "$GITHUB_STEP_SUMMARY"
          [ "$VERDICT" = "pass" ] || { echo "::error::Findings bloquants — voir les commentaires inline."; exit 1; }
