name: ai-review
# Couche 2 de la review. Ne tourne que sur une PR passée en "ready",
# jamais sur un draft : un draft ne se review pas, il se travaille.
on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      # TRA-510: read the previous head's `review` check-run and its annotations (the reuse decision).
      checks: read
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      # TRA-510 (2026-10-15): the merge queue's `gh pr update-branch` pushes a merge commit (`synchronize`)
      # and used to restart the whole review (~4-5 min, ~0.84 USD) although the PR's own diff was unchanged.
      # When the diff is the same as the one the previous head's review passed, that verdict is reused:
      # this job's `review` check-run (the one review-gate.yml reads) simply succeeds without calling the
      # model. Every doubt or error leaves `decision` unset, which means a full review (fail closed).
      # The patch-id travels as a notice annotation of the job's check-run. That is NOT tamper-proof: any
      # workflow step of the PR runs as the same app and could write one. So a verdict is only inherited from a
      # previous head that left `.github/` alone, on a PR targeting the default branch, through a plain
      # "merge the default branch" commit, on a first run attempt (all checked below before the script decides).
      - name: Compute the patch-id of the PR diff
        id: patch
        continue-on-error: true
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          # --verbatim keeps whitespace significant (YAML, Makefiles), --binary and the mode/create/delete
          # summary cover what `git patch-id` alone does not see; the id is useless as soon as any part changes.
          patch=$(git diff --binary --no-ext-diff --no-textconv --no-renames "$base" HEAD | git patch-id --verbatim | cut -d' ' -f1)
          shape=$(git diff --summary --no-renames "$base" HEAD | git hash-object --stdin)
          [[ "$patch" =~ ^[0-9a-f]{40}$ && "$shape" =~ ^[0-9a-f]{40}$ ]]
          echo "id=$patch-$shape" >> "$GITHUB_OUTPUT"

      # A re-run (run_attempt > 1) never reuses: the Decide step is skipped, which means a full review.
      - uses: actions/setup-node@v4
        if: github.event.action == 'synchronize' && github.run_attempt == 1
        continue-on-error: true
        with: { node-version: 22 }

      - name: Decide whether the previous verdict can be reused
        id: decide
        if: github.event.action == 'synchronize' && github.run_attempt == 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIOUS_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_ID: ${{ steps.patch.outputs.id }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The decision code comes from the default branch, never from the PR checkout nor from the PR's base
          # (a stacked PR's base is unreviewed): a PR cannot make the script that gates its own review say
          # "reuse". It imports nothing, so no `npm ci` is needed.
          trusted="$RUNNER_TEMP/review-reuse"
          rm -rf "$trusted"
          mkdir -p "$trusted"
          git show "origin/$DEFAULT_BRANCH:scripts/ci/review-reuse.ts" > "$trusted/review-reuse.ts"
          echo '{"type":"module"}' > "$trusted/package.json"
          # Facts for the script, established with git; any failure leaves them empty, which means "full".
          # 1. The previous head changed nothing under .github/ (no workflow of the PR could have forged a record).
          leaves_workflows_alone=""
          if mb=$(git merge-base "origin/$DEFAULT_BRANCH" "$PREVIOUS_SHA" 2>/dev/null); then
            rc=0
            git diff --quiet "$mb" "$PREVIOUS_SHA" -- .github/ || rc=$?
            case "$rc" in 0) leaves_workflows_alone=true ;; 1) leaves_workflows_alone=false ;; esac
          fi
          # 2. The head is what `gh pr update-branch` produces: a merge of the previous head (^1) and of a
          #    commit of the default branch (^2). A plain commit that moves a hunk would keep the patch-id.
          head_is_update_merge=false
          if parents=$(git rev-list --parents -n 1 "$HEAD_SHA" 2>/dev/null); then
            set -- $parents
            if [ "$#" -eq 3 ] && [ "$1" = "$HEAD_SHA" ] && [ "$2" = "$PREVIOUS_SHA" ] \
              && git merge-base --is-ancestor "$3" "origin/$DEFAULT_BRANCH"; then
              head_is_update_merge=true
            fi
          fi
          export PREVIOUS_LEAVES_WORKFLOWS_ALONE="$leaves_workflows_alone" HEAD_IS_UPDATE_MERGE="$head_is_update_merge"
          result=$(node --experimental-strip-types --no-warnings "$trusted/review-reuse.ts")
          echo "$result"
          decision=$(jq -r '.decision' <<< "$result")
          [[ "$decision" == "reuse" || "$decision" == "full" ]]
          {
            echo "decision=$decision"
            echo "previous_sha=$(jq -r '.previousSha // ""' <<< "$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Reuse the previous verdict
        if: steps.decide.outputs.decision == 'reuse'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.decide.outputs.previous_sha }}
          PATCH_ID: ${{ steps.patch.outputs.id }}
        run: |
          message="verdict réutilisé de $PREVIOUS_SHA, patch-id $PATCH_ID"
          echo "::notice::$message"
          echo "::notice::review-patch-id v1 $PATCH_ID"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Clear any previous verdict
        if: steps.decide.outputs.decision != 'reuse'
        # runner.temp is emptied by the runner between jobs, but claude-code-action itself notes
        # that this cleanup is not reliably honored on persistent self-hosted runners.
        run: rm -f "$RUNNER_TEMP/review.json"

      - name: Review Claude
        if: steps.decide.outputs.decision != 'reuse'
        uses: anthropics/claude-code-action@v1
        with:
          # Token d'abonnement : la review est facturée sur le plan Max,
          # pas en crédits API. C'est le principal levier de coût du process.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2026-09-17 (TRA-246): the verdict lives in runner.temp, not /tmp. On the self-hosted
          # runner /tmp persists across jobs, so a review that wrote nothing let the Gate read the
          # previous PR's verdict (#219's "pass" was still there during #215's review). The runner
          # empties runner.temp at the start and end of every job, and each runner has its own.
          prompt: |
            Tu reviewes la PR #${{ github.event.pull_request.number }} de
            ${{ github.repository }}. Budget serré : conclus et écris
            ${{ runner.temp }}/review.json en 15 tours ou moins si possible — tu en as
            60 au maximum avant coupure forcée, ne les utilise pas comme
            objectif.

            1. Lis REVIEW.md à la racine et applique-le à la lettre, y
               compris le plafond de nits et la barre de preuve (pas de
               déduction depuis un nom de fichier ou de fonction).
            2. Un seul `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
               pour tout le diff. Ne relis un fichier en entier ou ne grep
               que si ce diff seul ne suffit pas à trancher un finding
               précis — pas de relecture ou de grep systématique fichier
               par fichier. Le budget de tours ne justifie jamais un
               finding "block" non vérifié dans le code réel : si tu
               hésites à lire plus pour trancher, lis plus ; dans le
               doute persistant, classe en "nit" (barre de preuve de
               REVIEW.md).
            3. Écris ${{ runner.temp }}/review.json en premier, et rien d'autre dans ce
               fichier :
               {"verdict":"pass"|"block","blocking":<n>,"nits":<n>,
                "summary":"<une ligne>",
                "findings":[{"file":"","line":0,"severity":"block"|"nit"|"pre-existing","message":""}]}
               verdict = "block" seulement s'il existe au moins un finding
               de sévérité "block" au sens de REVIEW.md.
            4. Ensuite seulement, poste un commentaire inline — Français,
               via l'outil de commentaire inline — pour chaque finding
               "block", et uniquement ceux-là. Les nits restent dans
               review.json (résumé et liste) sans commentaire inline :
               REVIEW.md plafonne déjà leur affichage à 5 avec un compte
               agrégé au-delà.
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write,mcp__github_inline_comment__create_inline_comment"

      - name: Gate
        id: gate
        if: steps.decide.outputs.decision != 'reuse'
        run: |
          REVIEW_JSON="$RUNNER_TEMP/review.json"
          if [ ! -f "$REVIEW_JSON" ]; then
            echo "::error::La review n'a pas produit de verdict."
            exit 1
          fi
          cat "$REVIEW_JSON"
          VERDICT=$(jq -r '.verdict' "$REVIEW_JSON")
          jq -r '"\(.blocking) bloquant(s), \(.nits) nit(s) — \(.summary)"' "$REVIEW_JSON" >> "$GITHUB_STEP_SUMMARY"
          [ "$VERDICT" = "pass" ] || { echo "::error::Findings bloquants — voir les commentaires inline."; exit 1; }

      # Only a full review that passed the Gate gets here (no status function: the implicit success()).
      # A failed or blocked review records nothing, so the next head cannot inherit it.
      - name: Record the reviewed patch-id
        if: steps.decide.outputs.decision != 'reuse' && steps.patch.outputs.id != ''
        shell: bash
        env:
          PATCH_ID: ${{ steps.patch.outputs.id }}
        run: echo "::notice::review-patch-id v1 $PATCH_ID"
