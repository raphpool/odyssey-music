name: ai-review
# Couche 2 de la review. Ne tourne que sur une PR passée en "ready",
# jamais sur un draft : un draft ne se review pas, il se travaille.
on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 2026-11-16 (TRA-703): a pull request from a fork gets no review. The repository is public and this job
    # runs with write access to pull requests. This job is then skipped, which `review-gate` reads as a missing
    # review: it waits for the full polling window, then fails closed. That blocks the merge, on purpose.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # 2026-11-16 (TRA-703): hosted runner, the self-hosted ones have been off since 2026-10-24.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      # TRA-510: read the previous head's `review` check-run and its annotations (the reuse decision).
      checks: read
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      # TRA-529 (2026-10-24): the verdict carries the pull request and the base it was produced against. review-gate.yml
      # and review-reuse.ts accept it only for this PR, against the default branch. Neither the run (`pull_requests[]`
      # is recomputed at every read, so a retargeted PR shows its new base on an old run) nor the check-run keeps the
      # base the review ran against; the event of the run does, and it is written here, before anything else, so that
      # every conclusion of this job (success, a blocking failure, a reuse) has it. Same standing as the patch-id
      # below: a notice any workflow step of the PR could write too, so an honest record, not a proof.
      # Fail closed: a base ref outside the plain charset (a `%` would be decoded by the runner into a newline) leaves
      # no record, which the gate reads as no review. The review itself still runs.
      - name: Record the pull request and the base of this review
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          export LC_ALL=C
          if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::notice::review-base v1 $PR_NUMBER $BASE_REF"
          else
            echo "::warning::review-base non enregistré (numéro de PR ou nom de base inattendu) : le gate ne comptera pas cette review."
          fi
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      # TRA-510 (2026-10-15): the merge queue's `gh pr update-branch` pushes a merge commit (`synchronize`)
      # and used to restart the whole review (~4-5 min, ~0.84 USD) although the PR's own diff was unchanged.
      # When the diff is the same as the one the previous head's review passed, that verdict is reused:
      # this job's `review` check-run (the one review-gate.yml reads) simply succeeds without calling the
      # model. Every doubt or error leaves `decision` unset, which means a full review (fail closed).
      # The patch-id travels as a notice annotation of the job's check-run. That is NOT tamper-proof: any
      # workflow step of the PR runs as the same app and could write one. So a verdict is only inherited from a
      # previous head that left `.github/` alone, on a PR targeting the default branch, through a plain
      # "merge the default branch" commit, on a first run attempt (all checked below before the script decides),
      # and only if that review recorded this PR against the default branch (TRA-529, first step above).
      - name: Compute the patch-id of the PR diff
        id: patch
        continue-on-error: true
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          # --verbatim keeps whitespace significant (YAML, Makefiles), --binary and the mode/create/delete
          # summary cover what `git patch-id` alone does not see; the id is useless as soon as any part changes.
          patch=$(git diff --binary --no-ext-diff --no-textconv --no-renames "$base" HEAD | git patch-id --verbatim | cut -d' ' -f1)
          shape=$(git diff --summary --no-renames "$base" HEAD | git hash-object --stdin)
          [[ "$patch" =~ ^[0-9a-f]{40}$ && "$shape" =~ ^[0-9a-f]{40}$ ]]
          echo "id=$patch-$shape" >> "$GITHUB_OUTPUT"

      # A re-run (run_attempt > 1) never reuses: the Decide step is skipped, which means a full review.
      - uses: actions/setup-node@v4
        if: github.event.action == 'synchronize' && github.run_attempt == 1
        continue-on-error: true
        with: { node-version: 22 }

      - name: Decide whether the previous verdict can be reused
        id: decide
        if: github.event.action == 'synchronize' && github.run_attempt == 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIOUS_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_ID: ${{ steps.patch.outputs.id }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The decision code comes from the default branch, never from the PR checkout nor from the PR's base
          # (a stacked PR's base is unreviewed): a PR cannot make the script that gates its own review say
          # "reuse". It imports nothing, so no `npm ci` is needed.
          trusted="$RUNNER_TEMP/review-reuse"
          rm -rf "$trusted"
          mkdir -p "$trusted"
          git show "origin/$DEFAULT_BRANCH:scripts/ci/review-reuse.ts" > "$trusted/review-reuse.ts"
          echo '{"type":"module"}' > "$trusted/package.json"
          # Facts for the script, established with git; any failure leaves them empty, which means "full".
          # 1. The previous head changed nothing under .github/ (no workflow of the PR could have forged a record).
          leaves_workflows_alone=""
          if mb=$(git merge-base "origin/$DEFAULT_BRANCH" "$PREVIOUS_SHA" 2>/dev/null); then
            rc=0
            git diff --quiet "$mb" "$PREVIOUS_SHA" -- .github/ || rc=$?
            case "$rc" in 0) leaves_workflows_alone=true ;; 1) leaves_workflows_alone=false ;; esac
          fi
          # 2. The head is what `gh pr update-branch` produces: a merge of the previous head (^1) and of a
          #    commit of the default branch (^2). A plain commit that moves a hunk would keep the patch-id.
          head_is_update_merge=false
          if parents=$(git rev-list --parents -n 1 "$HEAD_SHA" 2>/dev/null); then
            set -- $parents
            if [ "$#" -eq 3 ] && [ "$1" = "$HEAD_SHA" ] && [ "$2" = "$PREVIOUS_SHA" ] \
              && git merge-base --is-ancestor "$3" "origin/$DEFAULT_BRANCH"; then
              head_is_update_merge=true
            fi
          fi
          export PREVIOUS_LEAVES_WORKFLOWS_ALONE="$leaves_workflows_alone" HEAD_IS_UPDATE_MERGE="$head_is_update_merge"
          result=$(node --experimental-strip-types --no-warnings "$trusted/review-reuse.ts")
          echo "$result"
          decision=$(jq -r '.decision' <<< "$result")
          [[ "$decision" == "reuse" || "$decision" == "full" ]]
          {
            echo "decision=$decision"
            echo "previous_sha=$(jq -r '.previousSha // ""' <<< "$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Reuse the previous verdict
        if: steps.decide.outputs.decision == 'reuse'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.decide.outputs.previous_sha }}
          PATCH_ID: ${{ steps.patch.outputs.id }}
        run: |
          message="verdict réutilisé de $PREVIOUS_SHA, patch-id $PATCH_ID"
          echo "::notice::$message"
          echo "::notice::review-patch-id v1 $PATCH_ID"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Clear any previous verdict
        if: steps.decide.outputs.decision != 'reuse'
        # runner.temp is emptied by the runner between jobs, but claude-code-action itself notes
        # that this cleanup is not reliably honored on persistent self-hosted runners.
        run: rm -f "$RUNNER_TEMP/review.json"

      - name: Review Claude
        if: steps.decide.outputs.decision != 'reuse'
        uses: anthropics/claude-code-action@v1
        with:
          # Token d'abonnement : la review est facturée sur le plan Max,
          # pas en crédits API. C'est le principal levier de coût du process.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2026-09-17 (TRA-246): the verdict lives in runner.temp, not /tmp. On the self-hosted
          # runner /tmp persists across jobs, so a review that wrote nothing let the Gate read the
          # previous PR's verdict (#219's "pass" was still there during #215's review). The runner
          # empties runner.temp at the start and end of every job, and each runner has its own.
          prompt: |
            Tu reviewes la PR #${{ github.event.pull_request.number }} de
            ${{ github.repository }}. Budget serré : conclus et écris
            ${{ runner.temp }}/review.json en 15 tours ou moins si possible — tu en as
            60 au maximum avant coupure forcée, ne les utilise pas comme
            objectif.

            1. Lis REVIEW.md à la racine et applique-le à la lettre, y
               compris le plafond de nits et la barre de preuve (pas de
               déduction depuis un nom de fichier ou de fonction).
            2. Un seul `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
               pour tout le diff. Ne relis un fichier en entier ou ne grep
               que si ce diff seul ne suffit pas à trancher un finding
               précis — pas de relecture ou de grep systématique fichier
               par fichier. Le budget de tours ne justifie jamais un
               finding "block" non vérifié dans le code réel : si tu
               hésites à lire plus pour trancher, lis plus ; dans le
               doute persistant, classe en "nit" (barre de preuve de
               REVIEW.md).
            3. Écris ${{ runner.temp }}/review.json en premier, et rien d'autre dans ce
               fichier :
               {"verdict":"pass"|"block","blocking":<n>,"nits":<n>,
                "summary":"<une ligne>",
                "findings":[{"file":"","line":0,"severity":"block"|"nit"|"pre-existing","message":""}]}
               verdict = "block" seulement s'il existe au moins un finding
               de sévérité "block" au sens de REVIEW.md.
            4. Ensuite seulement, poste un commentaire inline — Français,
               via l'outil de commentaire inline — pour chaque finding
               "block", et uniquement ceux-là. Les nits restent dans
               review.json (résumé et liste) sans commentaire inline :
               REVIEW.md plafonne déjà leur affichage à 5 avec un compte
               agrégé au-delà.
          # TRA-553 (2026-10-16): `--setting-sources user` keeps the project and local setting sources out. The
          # action defaults to "user,project,local" (base-action/src/parse-sdk-options.ts, whose comment names this
          # very flag "to avoid in-repo configs"). It is NOT here to stop the PR's own files: the action already
          # restores `.claude`, `.mcp.json` and CLAUDE.md from origin/main before it starts (log of run 38812502206).
          # What the option buys: (1) the reviewer no longer gets the permissions and hooks of main's
          # `.claude/settings.json` (`Bash(npx *)`, `Bash(npm run *)`, `Bash(git *)`, `Bash(gh pr *)`), only the tools of
          # --allowedTools below; (2) it covers stacked PRs, whose base is not main and is not reviewed, so the
          # restored files may be unreviewed; (3) it no longer depends on what the moving `v1` tag does about the
          # restore. What remains is the job-scoped HOME (first step), with the action's own ~/.claude/settings.json.
          # The prompt reads REVIEW.md itself and nothing in the review needs CLAUDE.md, which is deliberately not
          # loaded (REVIEW.md does not refer to it).
          # `--strict-mcp-config` is the same defence for MCP: the action writes `enableAllProjectMcpServers: true`
          # into the user settings it keeps, which `--setting-sources user` does not remove, so a `.mcp.json` in the
          # checkout (a stacked PR's, or one that the restore missed) would otherwise start its own MCP server (a
          # `command`) on the runner. Only the `--mcp-config` the action itself adds (the inline comment tool) is used.
          claude_args: |
            --setting-sources user
            --strict-mcp-config
            --model claude-opus-5
            --effort xhigh
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write,mcp__github_inline_comment__create_inline_comment"

      - name: Gate
        id: gate
        if: steps.decide.outputs.decision != 'reuse'
        run: |
          REVIEW_JSON="$RUNNER_TEMP/review.json"
          if [ ! -f "$REVIEW_JSON" ]; then
            echo "::error::La review n'a pas produit de verdict."
            exit 1
          fi
          cat "$REVIEW_JSON"
          VERDICT=$(jq -r '.verdict' "$REVIEW_JSON")
          jq -r '"\(.blocking) bloquant(s), \(.nits) nit(s) — \(.summary)"' "$REVIEW_JSON" >> "$GITHUB_STEP_SUMMARY"
          [ "$VERDICT" = "pass" ] || { echo "::error::Findings bloquants — voir les commentaires inline."; exit 1; }

      # Only a full review that passed the Gate gets here (no status function: the implicit success()).
      # A failed or blocked review records nothing, so the next head cannot inherit it.
      - name: Record the reviewed patch-id
        if: steps.decide.outputs.decision != 'reuse' && steps.patch.outputs.id != ''
        shell: bash
        env:
          PATCH_ID: ${{ steps.patch.outputs.id }}
        run: echo "::notice::review-patch-id v1 $PATCH_ID"

  # TRA-754 (2026-11-16): the deep review of a tier/3 PR, run here rather than published from a Mac; review-gate.yml reads
  # the `deep-review` job like `review` and hands its conclusion to the policy as `deepClaude`. Fail closed: below tier 3
  # that job is SKIPPED (read `missing`), never a success that reviewed nothing, which a `tier/3` label added later (no
  # `labeled` trigger here) would inherit. A PR that edits this file runs its own copy: the policy refuses it for gate files.
  deep-review-tier:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.0 }
      - name: Compute the tier of the PR
        id: tier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The classifier comes from the default branch, never from the PR; an unreadable copy fails the job.
          trusted="$RUNNER_TEMP/review-gate-policy"
          mkdir -p "$trusted"
          git show "origin/$DEFAULT_BRANCH:scripts/ci/review-gate-policy.ts" > "$trusted/review-gate-policy.ts"
          echo '{"type":"module"}' > "$trusted/package.json"
          # Same paths as the gate (--no-renames, -z).
          paths=$(git diff -z --name-only --no-renames "$BASE_SHA"..."$HEAD_SHA" | tr '\0' '\n' | jq -R . | jq -s .)
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          # The module path goes through env, not argv: the policy runs its CLI when argv[1] ends with its own name.
          tier=$(POLICY="file://$trusted/review-gate-policy.ts" PATHS="$paths" LABELS="$labels" \
            node --experimental-strip-types --no-warnings --input-type=module \
            -e 'const { classifyRisk } = await import(process.env.POLICY); console.log(classifyRisk(JSON.parse(process.env.PATHS), JSON.parse(process.env.LABELS)))')
          [[ "$tier" =~ ^[123]$ ]]
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

  # No status function in the `if`: when the tier job is skipped or fails, this one is skipped.
  deep-review:
    needs: deep-review-tier
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.deep-review-tier.outputs.tier == '3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      checks: read
    steps:
      # TRA-529: the same record as `review`, first, so that every conclusion of this job carries it.
      - name: Record the pull request and the base of this review
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          export LC_ALL=C
          if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::notice::review-base v1 $PR_NUMBER $BASE_REF"
          else
            echo "::warning::review-base non enregistré (numéro de PR ou nom de base inattendu) : le gate ne comptera pas cette review."
          fi
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Load the review rubric from the default branch
        # Not the PR's own REVIEW.md (it would calibrate its own review); an unreadable copy fails the job.
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git show "origin/$DEFAULT_BRANCH:REVIEW.md" > "$RUNNER_TEMP/REVIEW.default.md"
      - name: Deep review Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review profonde (tier 3) de la PR #${{ github.event.pull_request.number }} de ${{ github.repository }}, 60 tours au plus.
            1. Lis ${{ runner.temp }}/REVIEW.default.md (le REVIEW.md de la branche par défaut, jamais
               celui de la PR) et applique-le à la lettre : plafond de nits, barre de preuve.
            2. `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`, puis lis le code réel avant tout finding "block".
               Axes : exactitude ; sécurité et secrets ; intégrité de la CI et du gate ; perte de données ; contrats publics.
            3. Écris ${{ runner.temp }}/deep-review.json en premier, et rien d'autre dans ce fichier :
               {"verdict":"pass"|"block","blocking":<n>,"nits":<n>,"summary":"<une ligne>",
                "findings":[{"file":"","line":0,"severity":"block"|"nit"|"pre-existing","message":""}]}
            4. Ensuite seulement, un commentaire inline en français par finding "block", et eux seuls.
          # TRA-553: the hardening of `review`. `Write` is for the verdict file in runner.temp.
          claude_args: |
            --setting-sources user
            --strict-mcp-config
            --model claude-opus-5
            --effort xhigh
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write,mcp__github_inline_comment__create_inline_comment"
      - name: Gate on the deep verdict
        run: |
          verdict="$RUNNER_TEMP/deep-review.json"
          [ -f "$verdict" ] || { echo "::error::La review profonde n'a pas produit de verdict."; exit 1; }
          cat "$verdict"
          jq -r '"\(.blocking) bloquant(s), \(.nits) nit(s) — \(.summary)"' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.verdict == "pass" and .blocking == 0 and all(.findings[]?; .severity != "block")' "$verdict" > /dev/null \
            || { echo "::error::Findings bloquants de la review profonde — voir les commentaires inline."; exit 1; }
