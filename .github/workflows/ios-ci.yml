name: ios-ci

# No push trigger (TRA-411, 2026-10-12): main is strict-protected, so the merge commit is the tree this
# check already ran on the PR; a push run only held a self-hosted runner while the next PR waited.
# Path filter (TRA-415, TRA-417, 2026-10-12): #338 changed 3 lines under .claude/ and held the `ios` runner for
# 19 min; after TRA-415 ignored .claude/, docs/ and *.md, #341 (only vitest.config.ts and a vitest setup file)
# still started ios-check, 10 min on a saturated Mac. A deny-list is never complete, so `paths` lists the
# inputs. ios-check is not a required check.
# Rule: every input must be listed in `paths`. test/native-ci-triggers.test.ts enforces it for the import graph
# of the contract harness, ios/, the `$repository_root/...` reads of check.sh and the known reads outside
# imports, and fails on a ../ in the Xcode project files. Keep the dispatcher's ci-merge.sh in line.
# `paths` on pull_request: the workflow starts when at least one changed file matches at least one pattern, so
# a PR touching only unlisted files creates no run at all (ready or draft). `*` stays inside a path segment, `**`
# crosses `/`. `!` and `? + [ ] \` are forbidden: the test only models `*` and `**`. GitHub reads at most
# 3,000 files of a diff; if no matching file is among them the workflow does not start (no fail-safe there).
# Inputs of ios-check:
#   ios/**                          sources, Xcode project, check.sh, .xcode-version, .swift-format, Package.resolved
#   src/**                          the harness imports server.ts and its graph from src/ (root, mobile/, services/,
#                                   tools/); a folder, so a new module needs no tier/3 edit. Over-triggers on
#                                   src/cli.ts, crawler.ts, genre-seeds.ts and the like (not imported): accepted
#   test/helpers/mobile-contract-server.ts   the harness check.sh starts (its only file under test/)
#   data/*.json                     loaded at runtime by genre-identity, genre-registry, graph, genre-taxonomy
#   cache/**                        genre-taxonomy.ts cacheRootFor resolves taxonomy sources against <repo>/cache
#                                   whatever ODYSSEY_CACHE_DIR says; the catalog served to the XCTests includes
#                                   them (2026-10-12: 271 genres resolved with ODYSSEY_CACHE_DIR on an empty dir)
#   package.json, package-lock.json, tsconfig*.json   `npm ci` and tsx of the harness
#   .github/workflows/ios-ci.yml    this file
# Not listed: .deployed-sha (src/server.ts /version) is gitignored, no PR changes it; vitest.config.ts and
# test/**/*.test.ts are not read; biome.json and mobile/** belong to mobile-ci.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ios/**"
      - "src/**"
      - "test/helpers/mobile-contract-server.ts"
      - "data/*.json"
      - "cache/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # `ios` is carried by one runner only (2026-10-12): two simulators of ~6 GB in parallel saturated the
    # Mac (load 274, swap 11.4/12 GB) and the simulator did not boot within 600 s on #335.
    runs-on: [self-hosted, macOS, ARM64, ios]
    timeout-minutes: 30
    steps:
      - name: Isolate HOME from the runner host account
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run native Swift checks
        env:
          TRACK1_CI_OUTPUT_DIR: ${{ runner.temp }}/track1-ios
        run: ios/scripts/check.sh
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/track1-ios/*.xcresult
          if-no-files-found: warn
