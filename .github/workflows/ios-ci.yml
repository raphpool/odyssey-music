name: ios-ci

# No push trigger (TRA-411, 2026-10-12): main is strict-protected, so the merge commit is the tree this
# check already ran on the PR; a push run only held a self-hosted runner while the next PR waited.
# Path filter (TRA-415, 2026-10-12): #338 changed 3 lines under .claude/ and still held the `ios` runner for
# 19 min (ios-check) while the light jobs queued one after the other on the second runner. ios-check is not
# a required check, so a PR that only touches paths it never reads can skip it.
# Rule: an ignored path must never be an entry of ios/scripts/check.sh or of the contract harness. Only
# `paths-ignore` is used, so it fails safe: any path not listed below triggers the check.
# Inputs of ios-check, never to ignore: ios/** (sources, project, check.sh, .xcode-version, .swift-format,
# Package.resolved), test/helpers/mobile-contract-server.ts and every src/ module it imports (src/server.ts
# and its graph), data/*.json that src/ loads at runtime, package.json, package-lock.json, tsconfig*.json and
# this file.
# Ignored, each proven not to be read by check.sh or the harness:
#   .claude/**  agent and hook configuration, not shipped and not imported
#   docs/**     documents and design exports; src/ only names them in comments
#   *.md        root-level notes only (`*` stays in one segment); no **/*.md, a Markdown file under ios/
#               or mobile/ could be a bundled resource
# Keep test/native-ci-triggers.test.ts and the dispatcher's ci-merge.sh in line when this list changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - ".claude/**"
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # `ios` is carried by one runner only (2026-10-12): two simulators of ~6 GB in parallel saturated the
    # Mac (load 274, swap 11.4/12 GB) and the simulator did not boot within 600 s on #335.
    runs-on: [self-hosted, macOS, ARM64, ios]
    timeout-minutes: 30
    steps:
      - name: Isolate HOME from the runner host account
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run native Swift checks
        env:
          TRACK1_CI_OUTPUT_DIR: ${{ runner.temp }}/track1-ios
        run: ios/scripts/check.sh
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/track1-ios/*.xcresult
          if-no-files-found: warn
