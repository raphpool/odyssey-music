name: claude
# Corrections ponctuelles depuis la PR : "@claude corrige le finding sur src/x.ts:42".
# À réserver aux fix courts. Un changement structurel se fait en session locale.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --max-turns 25
