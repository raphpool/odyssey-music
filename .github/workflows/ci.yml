name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # TRA-441 (2026-10-13): a squash merge that only touches these paths changes nothing the server
    # runs, and the strict branch protection already guarantees the PR was tested on top of main.
    # GitHub still starts the run when ONE file of the pushed commit is outside the list, so a merge
    # mixing ios/ and src/ keeps its ci run. `pull_request` stays unfiltered: required checks run on every PR.
    # Not read in production: deploy-server.sh only rsyncs the tree (a copy, never read back), and
    # src/server.ts reads cache/ and .deployed-sha only; web/ is the only static root. The only
    # references to docs/ are comments. Accepted trade-offs: after an ignored merge /api/odyssey/version
    # keeps the previous SHA, and the PR-time run is the only one covering .claude/ and .codex/ tests.
    paths-ignore:
      - "ios/**"
      - "docs/**"
      - ".claude/**"
      - ".codex/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Adapté à ce repo : npm (package-lock.json), Node 20 comme deploy.yml.
# Pas de job `build` : le projet n'a rien à compiler — tsc tourne en --noEmit
# dans `typecheck`, et l'exécution passe par tsx. Ajouter un `build` bidon
# n'apporterait qu'un check vert qui ne teste rien.

jobs:
  typecheck:
    # Draft PRs are the agents' delivery mode: no CI run until ready_for_review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 2026-10-20 (TRA-650): Node jobs left the Mac for the dedicated Linux runners. Jobs waited ~3.7x longer for
    # a runner than they ran (lint: 0.5 min run, 4 min median wait), 74% of runner minutes were Node jobs, and
    # the three Mac runners shared one CPU. Only ios-check needs macOS (ios-ci.yml).
    # 2026-11-16 (TRA-703): every job of this file runs on a GitHub-hosted runner. The self-hosted ones have been
    # off since 2026-10-24, so the required checks of main stayed queued and no PR could merge.
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # `test` exclut déjà les *.live.test.ts, qui tapent les vraies API.
      # Pas de --coverage : @vitest/coverage-v8 n'est pas installé.
      - run: npm run test -- --run

  diff-size:
    # Size is a review signal, never the reason CI fails on its own. The policy script
    # reports hand-written, generated, and binary paths separately with provenance.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Mesurer le diff
        # TRA-498: the base branch name reaches the shell through env, never interpolated into the script.
        env: { BASE_REF: "${{ github.event.pull_request.base.ref }}" }
        run: |
          BASE="origin/$BASE_REF"
          git fetch origin "$BASE_REF" --depth=50
          set -o pipefail
          npx --no-install tsx scripts/ci/pr-policy.ts "$BASE" HEAD | tee "$RUNNER_TEMP/pr-policy.md"
          cat "$RUNNER_TEMP/pr-policy.md" >> "$GITHUB_STEP_SUMMARY"

  tier-guard:
    # Escalade automatique en tier/3 sur les chemins sensibles.
    # `deploy/` et `scripts/deploy-web.sh` sont ajoutés : ils poussent en prod.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # TRA-556: plain node, no `npm ci` and no `tsx`: the step below only parses a text file of the default
      # branch, so nothing of the PR checkout is installed or executed here.
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Charger les chemins sensibles de la branche par défaut
        # TRA-556 (2026-10-24): this job used to carry its own copy of `sensitivePath`
        # (scripts/ci/review-gate-policy.ts), kept in line by a text-for-text test. The pattern is now derived from
        # that file as it stands on the default branch, never from the PR checkout: a PR that edits `sensitivePath`
        # is classified by the pattern it is trying to change, like review-gate.yml does for the whole policy
        # (TRA-520). Only the default branch's copy is read, not the PR base's (a stacked PR's base is unreviewed).
        # The literal is read as text rather than imported: nothing of that file is executed on the runner, and
        # node 20 (the version of the other jobs) cannot strip TypeScript types. Fail closed: if the file or the
        # literal cannot be read, or uses a construct that JS and grep -E do not share, `set -e` stops the job and
        # the detection step below does not run, so no PR goes through unclassified.
        shell: bash
        env: { DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}" }
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/tier-guard"
          rm -rf "$trusted"
          mkdir -p "$trusted"
          git show "origin/$DEFAULT_BRANCH:scripts/ci/review-gate-policy.ts" > "$trusted/review-gate-policy.ts"
          test -s "$trusted/review-gate-policy.ts"
          POLICY_FILE="$trusted/review-gate-policy.ts" OUT_FILE="$trusted/sensitive-path.ere.tmp" node <<'JS'
          const fs = require("node:fs");
          const fail = (why) => {
            console.error("::error::sensitivePath de la branche par défaut inutilisable : " + why);
            process.exit(1);
          };
          const text = fs.readFileSync(process.env.POLICY_FILE, "utf8");
          const declaration = /^export const sensitivePath =\s*\/((?:\\.|[^/\\\n])+)\/([a-z]*);$/gm;
          const found = [...text.matchAll(declaration)];
          if (found.length !== 1) fail("la déclaration n'est pas trouvée exactement une fois (" + found.length + ")");
          const [, body, flags] = found[0];
          if (flags !== "i") fail("les drapeaux sont '" + flags + "', le job ne sait traduire que 'i' (grep -Eqi)");
          try {
            new RegExp(body, flags);
          } catch (error) {
            fail("expression invalide : " + error.message);
          }
          if (body.includes("(?")) fail("groupe spécial '(?' : absent de grep -E");
          if (/[^\x00-\x7f]/.test(body)) fail("caractère non ASCII : la casse de grep dépend de la locale du runner");
          if (/[*+?}]\?/.test(body)) fail("quantificateur paresseux : absent de grep -E");
          if (/\[[^\]]*[\\[]/.test(body)) fail("antislash ou crochet dans une classe de caractères : sens différent en JS et en grep -E");
          if (body.replace(/\\[.\/\\^$()|*+?{}[\]]/g, "").includes("\\")) fail("échappement qui n'a pas le même sens en JS et en grep -E");
          const ere = body.replace(/\\(.)/g, (pair, next) => (next === "/" ? "/" : pair));
          fs.writeFileSync(process.env.OUT_FILE, ere + "\n");
          JS
          test -s "$trusted/sensitive-path.ere.tmp"
          mv "$trusted/sensitive-path.ere.tmp" "$trusted/sensitive-path.ere"
          echo "Motif sensible (branche par défaut $DEFAULT_BRANCH) : $(cat "$trusted/sensitive-path.ere")"
      - name: Détecter les chemins sensibles
        # TRA-498: the base branch name reaches the shell through env, never interpolated into the script.
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", BASE_REF: "${{ github.event.pull_request.base.ref }}" }
        run: |
          # TRA-553 (2026-10-16): without pipefail, a failing `git diff` piped into `tr` would leave CHANGED empty
          # with status 0 (the default shell is `bash -e`, which looks at the last command of a pipeline only):
          # no label, no failure. With it the step fails.
          set -o pipefail
          BASE="origin/$BASE_REF"
          git fetch origin "$BASE_REF" --depth=50
          # TRA-553 (2026-10-15): --no-renames, otherwise `git mv REVIEW.md docs/REVIEW.md` lists only the
          # destination and the sensitive source path escapes the grep; with it both sides are listed. -z: without
          # it git quotes a path with a non-ASCII byte (`".github/workflows/\303\251.yml"`), and the leading quote
          # defeats every `^` anchor of the pattern; NUL-separated, paths come out raw (a newline inside a path
          # can only split it into more lines, which over-escalates and never hides one).
          CHANGED=$(git diff -z --name-only --no-renames "$BASE"...HEAD | tr '\0' '\n')
          # TRA-556: the pattern is the one the previous step derived from `sensitivePath` on the default branch.
          # TRA-498/TRA-553: `-i` is its flag `i` (APFS ignores case on the runner, so `review.md` is `REVIEW.md`
          # there). grep ends 0 on a match, 1 on none, 2 on an error: an unreadable pattern file or a bad pattern
          # must fail the job, not read as "nothing sensitive" and leave the PR unlabelled. The list reaches grep
          # through a here-string, not a pipe: `grep -q` stops at the first match, and with `pipefail` an `echo`
          # killed by SIGPIPE on a list larger than the pipe buffer (a big PR) would end the pipeline in 141.
          pattern="$RUNNER_TEMP/tier-guard/sensitive-path.ere"
          test -s "$pattern"
          status=0
          grep -Eqi -f "$pattern" <<< "$CHANGED" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep a échoué (statut $status) : la classification n'a pas pu être établie"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Chemin sensible touché → tier/3"
            gh pr edit "${{ github.event.pull_request.number }}" --add-label "tier/3"
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "tier/1" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "tier/2" || true
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "Classification terminée : chemin sensible modifié, escalade automatique en **tier/3**. Une review IA approfondie sur le SHA final et les checks requis verts sont nécessaires ; aucune approbation humaine de merge n'est obligatoire."
          fi

  integrity:
    # TRA-461: the cache audit (scripts/audit-cache.ts) fails when a measure exceeds its ceiling in
    # data/integrity-thresholds.json; on pull requests the ratchet also fails when a ceiling went up or
    # vanished against the base (coverage ceilings may rise by the number of nodes the PR added, TRA-498).
    # Not a required check: adding it to the branch protection is up to the owner.
    # No timeout-minutes, like the other jobs: the audit takes under 15 s.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HOME from the runner host account
        # 2026-09-17 (TRA-243): the self-hosted runner runs under Raphael's own macOS account, so
        # anything writing to $HOME (npm, git, claude-code-action's ~/.claude/settings.json) must
        # land in a job-scoped directory instead of his personal configuration.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      # fetch-depth 2: on a pull_request HEAD is the merge ref, and its first parent is the base the PR was
      # really tested on (TRA-498). Nothing else is fetched, so the base cannot move under the job.
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Auditer le cache
        # TRA-498: the audit output, violations (stderr) included, goes to the job summary even when it fails.
        # Calls the script directly, not `npm run audit:cache`: package.json is not a sensitive path, so a
        # tier/1 PR could otherwise redefine what that script runs.
        run: |
          set -o pipefail
          status=0
          npx --no-install tsx scripts/audit-cache.ts cache 2>"$RUNNER_TEMP/audit.err" | tee "$RUNNER_TEMP/audit.out" || status=$?
          cat "$RUNNER_TEMP/audit.err" >&2
          {
            echo "## Cache audit"
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.out"
            echo '```'
            if [ -s "$RUNNER_TEMP/audit.err" ]; then
              echo
              echo "### Violations"
              echo
              echo '```'
              cat "$RUNNER_TEMP/audit.err"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Cliquet des seuils
        # TRA-498: runs even when the audit failed, so one run reports both.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          # A pull_request checkout is the merge ref (2 parents): refuse anything else instead of guessing a base.
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null || { echo "::error::HEAD is not a merge ref"; exit 1; }
          BASE=HEAD^1
          set -o pipefail
          status=0
          npx --no-install tsx scripts/ci/threshold-ratchet.ts "$BASE" | tee "$RUNNER_TEMP/threshold-ratchet.md" || status=$?
          grep -v "^::" "$RUNNER_TEMP/threshold-ratchet.md" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 2 = no thresholds file on the base (first PR after TRA-448): accepted, the script already warned.
          if [ "$status" -eq 2 ]; then exit 0; fi
          exit "$status"
