<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Odyssey">
<meta name="theme-color" content="#050505">
<title>Odyssey · Culture Graph / Crab Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <div class="head">
    <a class="back" href="/">← back</a>
    <div class="title">Odyssey</div>
    <span class="sub">Culture Graph · Phase 1</span>
  </div>

  <div class="controls">
    <div class="search">
      <input id="search" type="search" placeholder="search an artist…" autocomplete="off" inputmode="search" />
      <button id="focus-seed">Focus seed</button>
      <button id="random">Random</button>
    </div>
    <div id="search-results" class="search-results" style="display:none;"></div>
  </div>

  <div class="stat" id="stat">…</div>

  <div class="crumbs" id="crumbs" style="display:none;"></div>

  <div id="content"></div>

  <div class="foot">
    Crawler at <a href="https://github.com/raphpool/odyssey-music">github.com/raphpool/odyssey-music</a> ·
    Agent powered by Gemini 3.1 Flash Lite + Tavily + Firecrawl via
    <a href="https://github.com/earendil-works/pi">pi</a>
  </div>
</div>

<!-- Persistent audio player. Mounted ONCE at page load, lives outside the view
     content so navigation (which only rewrites #content) never resets the <audio>
     element's playback state. -->
<div id="player">
  <div class="player-row">
    <button class="player-btn" id="player-toggle" aria-label="play/pause">▶</button>
    <div class="player-info">
      <div class="pt" id="player-title">—</div>
      <div class="pa" id="player-artist"></div>
    </div>
    <div class="player-bar" id="player-bar"><div class="fill" id="player-fill"></div></div>
    <button class="player-close" id="player-close" aria-label="close player">×</button>
  </div>
  <audio id="player-audio" preload="none"></audio>
</div>

<script>
const TYPE_ORDER = ["genre", "label", "artist", "project", "track"];
const TEASER_FIELD = {
  genre: "editorial_definition", label: "editorial_description",
  artist: "editorial_bio", project: "editorial_pitch", track: "editorial_teaser",
};
const FACT_FIELDS = {
  genre: ["era", "origin", "sonic_markers"],
  label: ["founded", "location", "founders", "active_years"],
  artist: ["origin", "active_years"],
  project: ["year", "bpm", "musical_key", "vocals", "samples_notes", "inspirations"],
  track: ["year", "duration", "bpm", "musical_key", "vocals", "samples_notes", "inspirations"],
};
const FACT_LABEL = {
  musical_key: "key",
  samples_notes: "samples",
  active_years: "active",
  sonic_markers: "sonic markers",
};

// ─── Hero image resolution ──────────────────────────────────────────────
// Each node type sources its hero image differently:
//   project           — own cover_url
//   track             — own cover_url, else parent project's
//   artist            — own photo_url, else any of their projects' covers
//   genre             — landmark project's cover, else landmark track's project
//   label             — notable release's cover
// Returns null when nothing is resolvable; the template renders the
// `.hero.no-image` gradient placeholder in that case.
function resolveHeroImage(node) {
  if (node.image_url) return node.image_url;
  const edges = node.edges || {};
  const pick = (refs) => {
    if (!refs) return null;
    const list = Array.isArray(refs) ? refs : [refs];
    for (const r of list) {
      const target = byId.get(r.slug);
      if (target && target.image_url) return target.image_url;
    }
    return null;
  };
  switch (node.type) {
    case "track":   return pick(edges.project);
    case "artist":  return pick(edges.discography) || pick(edges.notable_tracks);
    case "genre":   return pick(edges.landmark_projects) || pick(edges.landmark_tracks);
    case "label":   return pick(edges.notable_releases);
    default:        return null;
  }
}

// Short meta line shown under the hero title (e.g. "Radiohead · Kid A · 2000").
function buildHeroMeta(node) {
  const facts = node.facts || node;
  const parts = [];
  const artists = (node.edges && Array.isArray(node.edges.artists))
    ? node.edges.artists.map((a) => a.name).join(" · ") : "";
  switch (node.type) {
    case "genre":
      if (facts.era) parts.push(facts.era);
      if (facts.origin) parts.push(facts.origin);
      break;
    case "label":
      if (facts.location) parts.push(facts.location);
      if (facts.active_years) parts.push(facts.active_years);
      else if (facts.founded) parts.push(facts.founded);
      break;
    case "artist":
      if (facts.origin) parts.push(facts.origin);
      if (facts.active_years) parts.push(facts.active_years);
      break;
    case "project":
      if (artists) parts.push(artists);
      if (facts.year) parts.push(facts.year);
      break;
    case "track": {
      if (artists) parts.push(artists);
      const proj = node.edges && node.edges.project;
      if (proj && proj.name) parts.push(proj.name);
      if (facts.year) parts.push(facts.year);
      break;
    }
  }
  return parts.join(" · ");
}

// Sanitize a URL for use inside `style="background-image: url('...')"`.
// Single quotes would break out of the CSS url() literal; we percent-encode.
function safeCssUrl(u) {
  return String(u || "").replace(/'/g, "%27").replace(/[\s]/g, "%20");
}

// In-flight + completed JIT image lookups, keyed by node id. Prevents duplicate
// requests when the user rapidly clicks back to a node whose hero is still resolving.
const imageJitPromises = new Map();

/**
 * Fire `GET /image/:slug`, then mutate the currently-focused .node DOM to
 * paint in the resolved image. Idempotent — second calls for the same slug
 * share the original promise; if the user has navigated away by the time
 * the call returns, we just update `byId` (for future visits) and exit.
 */
async function jitResolveHero(slug) {
  if (!imageJitPromises.has(slug)) {
    imageJitPromises.set(slug, fetch(`${API_BASE}/image/${encodeURIComponent(slug)}`).then((r) => r.ok ? r.json() : null).catch(() => null));
  }
  const result = await imageJitPromises.get(slug);
  if (!result || !result.image_url) return;
  // Cache on the in-memory graph so revisits and edge-walks see it immediately.
  const cached = byId.get(slug);
  if (cached) cached.image_url = result.image_url;
  // Only paint if this slug is still the focused node (user might've clicked away).
  const currentId = crumbs[crumbs.length - 1];
  if (currentId !== slug) return;
  paintHero(result.image_url);
}

function paintHero(url) {
  const node = contentEl.querySelector(".node");
  if (!node) return;
  const hero = node.querySelector(".hero");
  if (!hero) return;
  const safe = safeCssUrl(url);
  hero.style.backgroundImage = `url('${safe}')`;
  hero.classList.remove("no-image");
  // Insert (or update) the tint backdrop. Inserted at the very start of .node so
  // it sits beneath everything via z-index: -2 / -1 in the stylesheet.
  let tint = node.querySelector(":scope > .node-tint");
  if (!tint) {
    tint = document.createElement("div");
    tint.className = "node-tint";
    const fade = document.createElement("div");
    fade.className = "node-tint-fade";
    node.prepend(fade);
    node.prepend(tint);
  }
  tint.style.backgroundImage = `url('${safe}')`;
}

let DATA = null;
let byId = new Map();
let SEED_ID = null;
let crumbs = []; // node ids forming the back-trail

const contentEl = document.getElementById("content");
const statEl = document.getElementById("stat");
const searchEl = document.getElementById("search");
const searchResults = document.getElementById("search-results");
const crumbsEl = document.getElementById("crumbs");

// JIT scrape endpoint. ?api=http://localhost:18791 overrides for local-dev; default uses
// the deployed odyssey-server when available. If the API is unreachable we silently disable JIT.
const API_BASE = (new URLSearchParams(location.search).get("api") || "/api/odyssey").replace(/\/$/, "");
let JIT_ENABLED = false;
const deadCache = new Set();

async function pingApi() {
  try {
    const r = await fetch(`${API_BASE}/health`);
    JIT_ENABLED = r.ok;
  } catch { JIT_ENABLED = false; }
}

(async function init() {
  await pingApi();
  const res = await fetch(JIT_ENABLED ? `${API_BASE}/data.json` : "./data.json", { cache: "no-cache" });
  DATA = await res.json();
  for (const n of DATA.nodes) byId.set(n.id, n);
  SEED_ID = DATA.nodes.find((n) => /tendency/.test(n.id))?.id || DATA.nodes[0].id;
  statEl.innerHTML = `<b style="color:var(--fg);font-weight:500;">${DATA.total}</b> nodes · <b style="color:var(--fg);font-weight:500;">${DATA.edges.length}</b> edges · seed: <span style="color:var(--accent);">${SEED_ID}</span>`;

  document.getElementById("focus-seed").addEventListener("click", () => { crumbs = []; show(SEED_ID); });
  document.getElementById("random").addEventListener("click", () => {
    crumbs = [];
    const n = DATA.nodes[Math.floor(Math.random() * DATA.nodes.length)];
    show(n.id);
  });

  // Rotating placeholder: cycles through entity types so the user understands the search scope.
  // Pauses while the input has focus or content so we don't fight the typing.
  const placeholderRotation = ["search an artist…", "search a track…", "search a genre…", "search an album…"];
  let placeholderIdx = 0;
  setInterval(() => {
    if (document.activeElement === searchEl || searchEl.value) return;
    placeholderIdx = (placeholderIdx + 1) % placeholderRotation.length;
    searchEl.placeholder = placeholderRotation[placeholderIdx];
  }, 2200);

  // Server-backed unified autocomplete. Hits cache nodes (zero-latency redirect) and the
  // MusicBrainz catalog rail (click to JIT-materialize, dedup by MBID). Falls back to the
  // in-memory graph filter if the API is offline so the page still works on the static export.
  let searchAbort = null;
  let searchDebounce = null;
  function localFallback(q) {
    const needle = q.toLowerCase();
    return DATA.nodes
      .filter((n) => n.name.toLowerCase().includes(needle) || n.id.toLowerCase().includes(needle))
      .slice(0, 10)
      .map((n) => ({ source: "cache", type: n.type, name: n.name, slug: n.id }));
  }
  async function runSearch(q) {
    if (!JIT_ENABLED) {
      renderSearchHits(localFallback(q), q);
      return;
    }
    if (searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    try {
      const r = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&limit=10`, {
        signal: searchAbort.signal,
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const body = await r.json();
      renderSearchHits(body.hits || [], q);
    } catch (e) {
      if (e.name === "AbortError") return;
      renderSearchHits(localFallback(q), q);
    }
  }
  function renderSearchHits(hits, q) {
    if (!hits.length) {
      searchResults.innerHTML = '<div class="row" style="cursor:default;color:var(--muted);"><span>no match for "' + escapeHtml(q) + '"</span></div>';
      searchResults.style.display = "block";
      return;
    }
    searchResults.innerHTML = hits
      .map((h, i) => {
        const subtitle = h.subtitle ? ` <span style="color:var(--muted);font-weight:300;">— ${escapeHtml(h.subtitle)}</span>` : "";
        const badge = h.source === "catalog"
          ? '<span style="margin-left:auto;font-size:0.65rem;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase;">+ generate</span>'
          : '<span style="margin-left:auto;font-size:0.65rem;letter-spacing:0.06em;color:var(--project);text-transform:uppercase;">odyssey</span>';
        return `<div class="row" data-idx="${i}" style="display:flex;align-items:center;gap:0.6rem;"><span class="t ${h.type}">${h.type}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(h.name)}${subtitle}</span>${badge}</div>`;
      })
      .join("");
    searchResults.style.display = "block";
    searchResults.querySelectorAll(".row[data-idx]").forEach((rowEl) => {
      const hit = hits[Number(rowEl.dataset.idx)];
      rowEl.addEventListener("click", () => onSearchHitClick(hit, rowEl));
    });
  }
  async function onSearchHitClick(hit, rowEl) {
    crumbs = [];
    searchEl.value = "";
    if (hit.source === "cache" && hit.slug && byId.has(hit.slug)) {
      searchResults.style.display = "none";
      show(hit.slug);
      return;
    }
    if (hit.source === "cache" && hit.slug && !byId.has(hit.slug)) {
      // Cache result whose viz-shape we don't have loaded yet (e.g. brand-new node since boot).
      // Pull it via the API and slot it in.
      rowEl.style.opacity = "0.6";
      try {
        const r = await fetch(`${API_BASE}/node/${encodeURIComponent(hit.slug)}`);
        if (r.ok) {
          const body = await r.json();
          insertNodeIntoData(body.node);
          searchResults.style.display = "none";
          show(hit.slug);
          return;
        }
      } catch {}
      rowEl.style.opacity = "1";
    }
    if (hit.source === "catalog" && JIT_ENABLED && hit.type && hit.name) {
      searchResults.style.display = "none";
      searchEl.blur();
      await runJitWithOverlay(hit);
    }
  }
  // Optimistic progress for the catalog-hit JIT overlay. Numbers from pipeline benchmarks
  // (p50 ~5s, p90 ~7s). The bar animates to 95% over EXPECTED_MS_BY_TYPE, then snaps to
  // 100% on response. Tracks/projects are quicker than artists/genres because the agent
  // has less surface area to enrich.
  const EXPECTED_MS_BY_TYPE = { genre: 6500, label: 5200, artist: 6500, project: 5200, track: 5000 };
  let jitOverlayEl = null;
  let jitAbortCtrl = null;
  function buildJitOverlay() {
    const el = document.createElement("div");
    el.className = "jit-overlay";
    el.innerHTML = `
      <div class="card">
        <div class="pill"></div>
        <div class="title"></div>
        <div class="subtitle"></div>
        <div class="bar"><i></i></div>
        <div class="status">Generating page · the agent is materializing this entity from scratch.</div>
        <button class="cancel" type="button">Cancel</button>
      </div>`;
    document.body.appendChild(el);
    el.querySelector(".cancel").addEventListener("click", () => {
      if (jitAbortCtrl) jitAbortCtrl.abort();
      hideJitOverlay();
    });
    // Click on the backdrop (outside the card) also cancels.
    el.addEventListener("click", (e) => {
      if (e.target === el) {
        if (jitAbortCtrl) jitAbortCtrl.abort();
        hideJitOverlay();
      }
    });
    return el;
  }
  function showJitOverlay(hit) {
    if (!jitOverlayEl) jitOverlayEl = buildJitOverlay();
    const card = jitOverlayEl.querySelector(".card");
    card.classList.remove("done");
    const pill = jitOverlayEl.querySelector(".pill");
    pill.className = `pill ${hit.type}`;
    pill.textContent = hit.type;
    jitOverlayEl.querySelector(".title").textContent = hit.name;
    jitOverlayEl.querySelector(".subtitle").textContent = hit.subtitle || "";
    jitOverlayEl.querySelector(".status").textContent =
      "Generating page · the agent is materializing this entity from scratch.";
    const bar = jitOverlayEl.querySelector(".bar > i");
    bar.style.width = "0%";
    const expected = EXPECTED_MS_BY_TYPE[hit.type] || 6000;
    // Phase 1: linear from 0 → 85% over the median expected wall time (p50). Most JIT runs
    // finish before this completes, so the bar feels honest. Phase 2 kicks in if we're
    // still waiting at phase-1 end and crawls 85 → 95% over 3× expected (covers the p99
    // long tail without ever pretending we're at 99% and stalling).
    card.style.setProperty("--progress-ms", `${expected}ms`);
    jitOverlayEl.classList.add("show");
    void bar.offsetWidth;
    requestAnimationFrame(() => { bar.style.width = "85%"; });
    // Schedule the slower phase-2 crawl. If finishJitOverlay fires first, .done overrides
    // the transition and snaps to 100%; otherwise this kicks in right as phase-1 ends.
    if (jitOverlayPhase2) clearTimeout(jitOverlayPhase2);
    jitOverlayPhase2 = setTimeout(() => {
      if (!jitOverlayEl || card.classList.contains("done")) return;
      card.style.setProperty("--progress-ms", `${expected * 3}ms`);
      void bar.offsetWidth;
      bar.style.width = "95%";
    }, expected);
  }
  let jitOverlayPhase2 = null;
  function hideJitOverlay() {
    if (!jitOverlayEl) return;
    jitOverlayEl.classList.remove("show");
  }
  function finishJitOverlay({ ok, message }) {
    if (!jitOverlayEl) return;
    if (jitOverlayPhase2) { clearTimeout(jitOverlayPhase2); jitOverlayPhase2 = null; }
    const card = jitOverlayEl.querySelector(".card");
    const bar = jitOverlayEl.querySelector(".bar > i");
    card.classList.add("done");
    bar.style.width = "100%";
    jitOverlayEl.querySelector(".status").textContent = ok
      ? "Done · loading page…"
      : `Failed: ${message || "unknown error"}`;
    if (!ok) return;
    // Auto-hide after a brief moment so the user feels the snap-to-100% before nav.
    setTimeout(() => hideJitOverlay(), 220);
  }
  async function runJitWithOverlay(hit) {
    showJitOverlay(hit);
    jitAbortCtrl = new AbortController();
    try {
      // Don't pass mbid as `disambiguator` — that becomes part of the slug body
      // (artist:drake--9fff2f8a-...) and the resulting node never reconciles with
      // parent edges pointing at the bare slug `artist:drake`. We pass an `mbid`
      // hint instead which the server stamps onto the materialized node payload;
      // /search uses cache-index.byMbid for dedup, no slug fragmentation needed.
      const reqBody = { type: hit.type, name: hit.name };
      if (hit.mbid) reqBody.mbid = hit.mbid;
      const r = await fetch(`${API_BASE}/materialize`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(reqBody),
        signal: jitAbortCtrl.signal,
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.node) throw new Error(body.error || `HTTP ${r.status}`);
      insertNodeIntoData(body.node);
      finishJitOverlay({ ok: true });
      show(body.node.slug);
    } catch (e) {
      if (e.name === "AbortError") {
        hideJitOverlay();
        return;
      }
      finishJitOverlay({ ok: false, message: e.message });
    } finally {
      jitAbortCtrl = null;
    }
  }
  function insertNodeIntoData(node) {
    const TEASER = { genre: "editorial_definition", label: "editorial_description", artist: "editorial_bio", project: "editorial_pitch", track: "editorial_teaser" };
    const teaserVal = node[TEASER[node.type]] || "";
    const edges = {};
    const LIST_EDGES = { genre:["parent_genres","subgenres","related_genres","key_artists","key_labels","landmark_projects","landmark_tracks"], label:["genres","roster","notable_releases"], artist:["genres","labels","discography","notable_tracks","influences","influenced","collaborators","aliases","members"], project:["artists","genres","tracklist","producers","personnel","related_projects"], track:["artists","genres","producers","personnel","samples","sampled_by","remixed_by"] };
    const SINGLE_EDGES = { genre:[], label:[], artist:[], project:["label"], track:["project","label","remix_of"] };
    for (const f of LIST_EDGES[node.type]) if (Array.isArray(node[f]) && node[f].length) edges[f] = node[f];
    for (const f of SINGLE_EDGES[node.type]) if (node[f] && typeof node[f] === "object") edges[f] = node[f];
    const vizNode = { id: node.slug, type: node.type, name: node.name, teaser: teaserVal, article: node.editorial_article, citations: node.citations || [], edges };
    byId.set(vizNode.id, vizNode);
    DATA.nodes.push(vizNode);
    DATA.total = DATA.nodes.length;
  }
  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim();
    if (!q || q.length < 2) {
      searchResults.style.display = "none";
      return;
    }
    if (searchDebounce) clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => runSearch(q), 150);
  });
  document.addEventListener("click", (e) => {
    if (e.target !== searchEl && !searchResults.contains(e.target)) searchResults.style.display = "none";
  });

  window.addEventListener("popstate", (e) => {
    const id = (e.state && e.state.id) || SEED_ID;
    show(id, { fromHistory: true });
  });

  const initial = new URLSearchParams(window.location.search).get("node");
  show(initial && byId.has(initial) ? initial : SEED_ID, { replaceHistory: true });
})();

function show(id, { fromHistory = false, replaceHistory = false } = {}) {
  const node = byId.get(id);
  if (!node) return;

  if (!fromHistory) {
    const newUrl = `?node=${encodeURIComponent(id)}`;
    if (replaceHistory) history.replaceState({ id }, "", newUrl);
    else history.pushState({ id }, "", newUrl);
  }

  // Crumbs: append unless already last
  if (!fromHistory && crumbs[crumbs.length - 1] !== id) {
    if (crumbs.length >= 12) crumbs.shift();
    crumbs.push(id);
  }
  renderCrumbs();

  const teaser = node.teaser || "";
  const facts = node.facts || node;
  const factParts = (FACT_FIELDS[node.type] || []).map((f) => {
    const v = facts[f];
    if (!v || typeof v !== "string") return null;
    const lbl = FACT_LABEL[f] || f.replace(/_/g, " ");
    return `<span>${lbl}<b>${escapeHtml(v)}</b></span>`;
  }).filter(Boolean).join("");

  const KIND_LABEL = {
    project: node.type === "track" ? "album / ep" : "project",
    label: "label",
    artists: "artist(s)",
    personnel: "personnel",
    tracklist: "tracks",
    discography: "discography",
    notable_tracks: "notable tracks",
    notable_releases: "notable releases",
    related_projects: "related albums",
    key_artists: "key artists",
    key_labels: "key labels",
    landmark_tracks: "landmark tracks",
    landmark_projects: "landmark albums",
    parent_genres: "parent genres",
    related_genres: "related genres",
    sampled_by: "sampled by",
    remix_of: "remix of",
    remixed_by: "remixed by",
  };
  const edgeHtml = Object.entries(node.edges || {}).map(([kind, val]) => {
    const refs = Array.isArray(val) ? val : [val];
    if (!refs.length) return "";
    const label = KIND_LABEL[kind] || kind.replace(/_/g, " ");
    // Pass parent context so JIT materialization can disambiguate ambiguous names
    // (e.g. track "Tendency" → which artist? The chip carries the parent node it
    // was referenced from + the edge kind, used as the disambiguator string).
    const parentCtx = { type: node.type, name: node.name, year: node.year, kind };
    const chips = refs.map((r) => chipHtml(r, parentCtx)).join("");
    return `<div class="edge-group"><div class="kind">${label}</div><div class="chips">${chips}</div></div>`;
  }).join("");

  const cits = (node.citations || []).map((c, i) => `<a href="${c.url}" target="_blank" rel="noopener"><span class="num">[${i+1}]</span>${escapeHtml(c.title || c.url)}</a>`).join("");

  const danglingCount = countDangling(node);
  const showPrecache = JIT_ENABLED && danglingCount > 0;
  const banner = showPrecache
    ? `<div class="jit-banner">⚡ JIT active · this node has <b style="color:var(--fg);">${danglingCount}</b> unmaterialized connections. Click any "↻" chip below to load on-demand, or <button id="precache-all">pre-cache all edges</button></div>`
    : "";

  const playBtnHtml = node.type === "track"
    ? `<button class="play-btn" id="track-play-btn" data-track-id="${escapeHtml(id)}">▶ play</button>`
    : "";

  const heroUrl = resolveHeroImage(node);
  const heroMeta = buildHeroMeta(node);
  const heroBg = heroUrl ? ` style="background-image: url('${safeCssUrl(heroUrl)}');"` : "";
  const heroClass = heroUrl ? "" : " no-image";
  const tintHtml = heroUrl
    ? `<div class="node-tint" style="background-image: url('${safeCssUrl(heroUrl)}');"></div><div class="node-tint-fade"></div>`
    : "";
  // Show slug (without `type:` prefix) on the right side of the header as a ref code.
  const slugRef = id.includes(":") ? id.split(":")[1] : id;
  const seedTag = id === SEED_ID ? ' · seed' : '';

  contentEl.innerHTML = `
    <div class="node stripe-${node.type}">
      ${tintHtml}
      <div class="node-header">
        <div class="badge ${node.type}">${node.type}${seedTag}</div>
        <div class="node-ref">${escapeHtml(slugRef)}</div>
      </div>
      <div class="hero${heroClass}"${heroBg}>
        <div class="hero-title-wrap">
          <h1>${escapeHtml(node.name)}</h1>
          ${heroMeta ? `<div class="hero-meta">${escapeHtml(heroMeta)}</div>` : ""}
        </div>
      </div>
      <div class="node-body">
        <div class="teaser-row">
          <div class="teaser-stripe"></div>
          <div class="teaser">${escapeHtml(teaser)}</div>
        </div>
        ${factParts ? `<div class="facts">${factParts}</div>` : ""}
        ${playBtnHtml}
        ${banner}
        <div class="article">${escapeHtml(node.article || "")}</div>
        ${edgeHtml ? `<div class="section">Connections</div>${edgeHtml}` : ""}
        <div class="section">Sources</div>
        <div class="citations">${cits || '<div style="color:var(--muted);font-size:0.85rem;font-style:italic;">No citations.</div>'}</div>
      </div>
    </div>
  `;

  // JIT hero-image resolution: if no image is available from the static bundle
  // (or from related nodes), ask the server. The server hits iTunes Search for
  // projects/tracks, walks edges for genres/labels/artists, and persists any hit
  // to the cache so subsequent loads are instant. Render happens immediately
  // with the gradient placeholder; we swap in the image when the call returns.
  if (!heroUrl && JIT_ENABLED) jitResolveHero(id);

  contentEl.querySelectorAll(".chip[data-id]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      show(el.dataset.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
  const playBtn = contentEl.querySelector("#track-play-btn");
  if (playBtn) {
    // If this track is the currently-loaded one, reflect that on the button.
    if (Player.currentTrackId === playBtn.dataset.trackId) {
      playBtn.textContent = Player.isPlaying() ? "❚❚ pause" : "▶ resume";
    }
    playBtn.addEventListener("click", () => Player.playTrack(node));
  }
  contentEl.querySelectorAll(".chip.dangling[data-jit-type]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      jitMaterialize(el.dataset.jitType, el.dataset.jitName, el, el.dataset.jitDisambig || "", el.dataset.jitMbid || "");
    });
  });
  const precacheBtn = contentEl.querySelector("#precache-all");
  if (precacheBtn) precacheBtn.addEventListener("click", () => precacheAllDangling(node, precacheBtn));

  window.scrollTo({ top: 0, behavior: "instant" });
}

function countDangling(node) {
  let n = 0;
  for (const v of Object.values(node.edges || {})) {
    const refs = Array.isArray(v) ? v : [v];
    for (const r of refs) if (!byId.has(r.slug) && !deadCache.has(r.slug)) n++;
  }
  return n;
}

async function precacheAllDangling(node, btn) {
  btn.disabled = true;
  btn.textContent = "loading…";
  const targets = [];
  // Carry parent context (kind, parent node) alongside each target so the
  // bulk materialize call disambiguates ambiguous names the same way the
  // single-chip JIT path does.
  for (const [kind, v] of Object.entries(node.edges || {})) {
    const refs = Array.isArray(v) ? v : [v];
    for (const r of refs) {
      if (byId.has(r.slug) || deadCache.has(r.slug)) continue;
      targets.push({ ref: r, kind });
    }
  }
  let done = 0;
  // Run 4 at a time
  const workers = Array.from({ length: 4 }, async () => {
    while (targets.length) {
      const t = targets.shift();
      if (!t) return;
      const { ref, kind } = t;
      // Don't pass parent context as disambiguator — it gets folded into the slug body
      // (artist:pupajim--roster-of-label-stand-high-records) and the resulting node never
      // reconciles with parent edges pointing at the bare slug. The agent has enough
      // surface area to identify the right entity from the name alone; if it ever
      // mis-routes, we can re-introduce context as a separate "context" field that's NOT
      // used in slug computation. For now: bare slug, always.
      const disambiguator = "";
      const reqBody = { type: ref.type, name: ref.name };
      if (disambiguator) reqBody.disambiguator = disambiguator;
      if (ref.mbid) reqBody.mbid = ref.mbid;
      try {
        await fetch(`${API_BASE}/materialize`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(reqBody),
        });
      } catch {}
      done++;
      btn.textContent = `loading ${done}/${done + targets.length}…`;
    }
  });
  await Promise.all(workers);
  // Reload data + redisplay
  const res = await fetch(`${API_BASE}/data.json`, { cache: "no-cache" });
  DATA = await res.json();
  byId.clear();
  for (const n of DATA.nodes) byId.set(n.id, n);
  show(node.id);
}

// Build a disambiguator string from the parent node + edge kind. The
// scraping agent receives this verbatim and uses it to lock onto the right
// entity when the bare name is ambiguous (multiple "Tendency" tracks, several
// artists called "Bird", etc.).
function buildDisambiguator(parentCtx) {
  if (!parentCtx || !parentCtx.name) return "";
  const kindLabel = (parentCtx.kind || "").replace(/_/g, " ");
  const yearPart = parentCtx.year ? `, ${parentCtx.year}` : "";
  // e.g. "appears as discography of artist Burial" / "subgenre of genre Techno"
  return `${kindLabel} of ${parentCtx.type} "${parentCtx.name}"${yearPart}`.trim();
}

function chipHtml(ref, parentCtx) {
  const inCache = byId.has(ref.slug);
  if (inCache) {
    return `<a class="chip t-${ref.type}" href="?node=${encodeURIComponent(ref.slug)}" data-id="${ref.slug}"><span class="etype">${ref.type}</span>${escapeHtml(ref.name)}</a>`;
  }
  if (deadCache.has(ref.slug)) {
    return `<span class="chip t-${ref.type} dead" title="agent could not materialize this entity"><span class="etype">${ref.type}</span>${escapeHtml(ref.name)}</span>`;
  }
  const action = JIT_ENABLED ? "JIT" : "";
  const title = JIT_ENABLED ? "click to materialize now" : "not yet materialized";
  // No more data-jit-disambig: the parent context used to be passed to /materialize as
  // `disambiguator`, which made the slug `artist:foo--<parent-context>` and never
  // reconciled with the bare-slug edges. Slug-from-name only now.
  const mbidAttr = ref.mbid ? ` data-jit-mbid="${ref.mbid}"` : "";
  return `<span class="chip t-${ref.type} dangling" data-jit-type="${ref.type}" data-jit-name="${escapeHtml(ref.name)}" data-jit-slug="${ref.slug}"${mbidAttr} title="${title}"><span class="etype">${ref.type}</span>${escapeHtml(ref.name)}${action ? " " : ""}</span>`;
}

// Expected wall time per node type, based on the pipeline benchmarks
// (p50 around 5s, p90 around 7s). Used to drive the optimistic progress bar.
const EXPECTED_MS_BY_TYPE = { genre: 6500, label: 5200, artist: 6500, project: 5200, track: 5000 };
async function jitMaterialize(type, name, chipEl, disambiguator, mbid) {
  if (!JIT_ENABLED) return;
  chipEl.classList.remove("dangling");
  chipEl.classList.add("loading");
  // Optimistic progress: target 95% over the expected duration, then snap on response.
  const expected = EXPECTED_MS_BY_TYPE[type] || 6000;
  chipEl.style.setProperty("--progress-ms", `${expected}ms`);
  // Force a layout flush so the transition picks up before we set the target width.
  void chipEl.offsetWidth;
  requestAnimationFrame(() => chipEl.style.setProperty("--progress", "95%"));
  const t0 = performance.now();
  try {
    const reqBody = { type, name };
    if (disambiguator) reqBody.disambiguator = disambiguator;
    // MBID pinned at emit time (artist.discography, project.tracklist, etc.) — passing it
    // here avoids "click Drake's ICEMAN → land on Sub Society 1990 ICEMAN" (Raph 2026-05-19).
    if (mbid) reqBody.mbid = mbid;
    const r = await fetch(`${API_BASE}/materialize`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reqBody),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.node) {
      throw new Error(body.error || `HTTP ${r.status}`);
    }
    const node = body.node;
    // Convert server payload → viz shape and slot it into DATA + byId.
    const TEASER = { genre: "editorial_definition", label: "editorial_description", artist: "editorial_bio", project: "editorial_pitch", track: "editorial_teaser" };
    const teaserVal = node[TEASER[node.type]] || "";
    const edges = {};
    const LIST_EDGES = { genre:["parent_genres","subgenres","related_genres","key_artists","key_labels","landmark_projects","landmark_tracks"], label:["genres","roster","notable_releases"], artist:["genres","labels","discography","notable_tracks","influences","influenced","collaborators","aliases","members"], project:["artists","genres","tracklist","producers","personnel","related_projects"], track:["artists","genres","producers","personnel","samples","sampled_by","remixed_by"] };
    const SINGLE_EDGES = { genre:[], label:[], artist:[], project:["label"], track:["project","label","remix_of"] };
    for (const f of LIST_EDGES[node.type]) if (Array.isArray(node[f]) && node[f].length) edges[f] = node[f];
    for (const f of SINGLE_EDGES[node.type]) if (node[f] && typeof node[f] === "object") edges[f] = node[f];
    const vizNode = { id: node.slug, type: node.type, name: node.name, teaser: teaserVal, article: node.editorial_article, citations: node.citations || [], edges };
    byId.set(vizNode.id, vizNode);
    DATA.nodes.push(vizNode);
    DATA.total = DATA.nodes.length;
    // Snap the progress bar to 100% then jump straight to the new node.
    chipEl.classList.add("done");
    chipEl.style.setProperty("--progress", "100%");
    await new Promise((r) => setTimeout(r, 200));
    show(vizNode.id);
  } catch (e) {
    deadCache.add(chipEl.dataset.jitSlug);
    chipEl.classList.remove("loading");
    chipEl.classList.add("dead");
    chipEl.title = `dead: ${e.message}`;
  }
}

function renderCrumbs() {
  if (crumbs.length <= 1) { crumbsEl.style.display = "none"; return; }
  const items = crumbs.slice(0, -1).map((id) => {
    const n = byId.get(id);
    if (!n) return "";
    return `<a href="?node=${encodeURIComponent(id)}" data-id="${id}">${escapeHtml(n.name)}</a>`;
  });
  items.push(`<span style="color:var(--fg);">${escapeHtml(byId.get(crumbs[crumbs.length - 1]).name)}</span>`);
  crumbsEl.innerHTML = items.join(' <span class="sep">›</span> ');
  crumbsEl.style.display = "flex";
  crumbsEl.querySelectorAll("a[data-id]").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = crumbs.indexOf(a.dataset.id);
      if (idx >= 0) crumbs = crumbs.slice(0, idx);
      show(a.dataset.id);
    });
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Sticky audio player. State + behavior live on this singleton, declared after
// DOM mount; the player <div> itself is in markup so it survives every #content
// re-render. `playTrack(node)` is idempotent: clicking play on the already-loaded
// track toggles pause/resume instead of re-resolving.
const Player = (() => {
  const root = document.getElementById("player");
  const audio = document.getElementById("player-audio");
  const toggleBtn = document.getElementById("player-toggle");
  const titleEl = document.getElementById("player-title");
  const artistEl = document.getElementById("player-artist");
  const bar = document.getElementById("player-bar");
  const fill = document.getElementById("player-fill");
  const closeBtn = document.getElementById("player-close");
  let currentTrackId = null;
  let resolving = false;

  function open() { root.classList.add("open"); document.body.classList.add("player-open"); }
  function close() {
    audio.pause(); audio.removeAttribute("src"); audio.load();
    root.classList.remove("open"); document.body.classList.remove("player-open");
    currentTrackId = null;
    refreshTrackBtn();
  }
  function isPlaying() { return !audio.paused && !audio.ended && audio.currentTime > 0; }

  function refreshTrackBtn() {
    const btn = document.getElementById("track-play-btn");
    if (!btn) return;
    if (btn.dataset.trackId === currentTrackId) {
      btn.textContent = isPlaying() ? "❚❚ pause" : "▶ resume";
      btn.disabled = false;
    } else {
      btn.textContent = "▶ play";
      btn.disabled = false;
    }
  }

  async function playTrack(node) {
    if (!node || node.type !== "track") return;
    // Same track: toggle pause/resume, no re-resolve.
    if (currentTrackId === node.id) {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
      refreshTrackBtn();
      return;
    }
    if (resolving) return;
    resolving = true;
    const trackBtn = document.getElementById("track-play-btn");
    if (trackBtn) { trackBtn.disabled = true; trackBtn.textContent = "resolving…"; }
    toggleBtn.disabled = true;
    titleEl.textContent = node.name;
    const artistEdge = (node.edges && (node.edges.artists || []))[0];
    artistEl.textContent = artistEdge ? artistEdge.name : "";
    open();
    try {
      const r = await fetch(`${API_BASE}/resolve/${encodeURIComponent(node.id)}`);
      if (!r.ok) throw new Error(`resolve http ${r.status}`);
      const data = await r.json();
      currentTrackId = node.id;
      audio.src = `${API_BASE}/stream/${encodeURIComponent(data.videoId)}`;
      await audio.play();
    } catch (e) {
      titleEl.textContent = node.name + " — playback unavailable";
      artistEl.textContent = String(e.message || e);
    } finally {
      resolving = false;
      toggleBtn.disabled = false;
      refreshTrackBtn();
    }
  }

  toggleBtn.addEventListener("click", () => {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  });
  closeBtn.addEventListener("click", close);
  audio.addEventListener("play", () => { toggleBtn.textContent = "❚❚"; refreshTrackBtn(); });
  audio.addEventListener("pause", () => { toggleBtn.textContent = "▶"; refreshTrackBtn(); });
  audio.addEventListener("ended", () => { toggleBtn.textContent = "▶"; refreshTrackBtn(); });
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
  });
  bar.addEventListener("click", (e) => {
    if (!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = Math.max(0, Math.min(audio.duration, pct * audio.duration));
  });

  return {
    playTrack,
    isPlaying,
    get currentTrackId() { return currentTrackId; },
  };
})();
</script>
</body>
</html>
